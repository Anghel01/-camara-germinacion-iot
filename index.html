<!DOCTYPE html>
<html lang="es" data-theme="oscuro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Cámara de Germinación Inteligente — Plan Maestro v2.0 (Grupo 1 EPN)</title>
  <meta name="theme-color" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 20A7 7 0 0 1 4 13a7 7 0 0 1 7-7c4 0 9 3 9 7a7 7 0 0 1-7 7z'/%3E%3Cpath d='M11 20V10'/%3E%3Cpath d='M11 14h4'/%3E%3C/svg%3E" />
  <style>
    :root[data-theme="oscuro"] {
      --bg-main: #0b111e;
      --bg-panel: #131c2e;
      --bg-card: #1a263d;
      --bg-hover: #243452;
      --bg-input: #0e1726;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #2a3b5c;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-soft: rgba(16, 185, 129, 0.15);
      --info: #3b82f6;
      --info-soft: rgba(59, 130, 246, 0.16);
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.16);
      --purple: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.16);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    :root[data-theme="claro"] {
      --bg-main: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-card: #f8fafc;
      --bg-hover: #e2e8f0;
      --bg-input: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --accent: #059669;
      --accent-hover: #047857;
      --accent-soft: rgba(5, 150, 105, 0.12);
      --info: #2563eb;
      --info-soft: rgba(37, 99, 235, 0.12);
      --warn: #d97706;
      --warn-soft: rgba(217, 119, 6, 0.14);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.12);
      --purple: #7e22ce;
      --purple-soft: rgba(126, 34, 206, 0.12);
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }

    /* TOPBAR */
    .topbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 9px;
      background: var(--accent-soft); border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; flex-shrink: 0;
    }
    .brand-title { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
    .brand-sub { font-size: 11.5px; color: var(--text-muted); }
    .topbar-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* NAV TABS */
    .nav-tabs {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      gap: 4px;
      padding: 6px 12px;
      scrollbar-width: thin;
    }
    .nav-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    .nav-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

    /* MAIN CONTAINER */
    .main-container {
      flex: 1;
      padding: 16px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    /* GRID & CARDS */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .card-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    /* BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .tag-PDF { background: var(--info-soft); color: var(--info); border: 1px solid var(--info); }
    .tag-DISENO { background: var(--purple-soft); color: var(--purple); border: 1px solid var(--purple); }
    .tag-VERIFICAR { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
    .tag-OPCIONAL { background: rgba(148, 163, 184, 0.18); color: var(--text-muted); border: 1px solid var(--border); }

    .status-Pendiente { background: rgba(148, 163, 184, 0.16); color: var(--text-muted); border: 1px solid var(--border); }
    .status-En-curso { background: var(--info-soft); color: var(--info); border: 1px solid var(--info); }
    .status-En-revision { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
    .status-Hecha { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
    .status-Bloqueada { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); }

    /* PROGRESS */
    .progress-wrap {
      width: 100%;
      background: var(--bg-input);
      height: 9px;
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #34d399);
      transition: width 0.25s ease;
    }

    /* FORMS & BUTTONS */
    input, select, textarea {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn-primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
    .btn-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
    .btn-sm { padding: 4px 8px; font-size: 11.5px; }

    /* TASK ITEM */
    .task-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
    }
    .task-item:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .task-item.blocked { border-left: 4px solid var(--danger); }
    .task-item.done { border-left: 4px solid var(--accent); }
    .task-id { font-family: monospace; font-weight: 700; font-size: 12.5px; color: var(--accent); }

    /* KANBAN */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(270px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .kanban-col {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      min-height: 480px;
    }
    .kanban-col-header {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kanban-dropzone { padding: 10px; flex: 1; }
    .kanban-dropzone.drag-over {
      background: var(--accent-soft);
      border: 2px dashed var(--accent);
      border-radius: 8px;
    }

    /* HORIZONTAL CHECKOUT PIPELINE TREE (DE IZQUIERDA A DERECHA) */
    .checkout-tree-container {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      scrollbar-width: thin;
    }
    .checkout-root-node {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.15);
      flex-shrink: 0;
    }
    .checkout-branch {
      position: relative;
      padding-left: 24px;
      margin-bottom: 28px;
      border-left: 3px solid var(--info);
    }
    .checkout-branch.parte-2 {
      border-left-color: var(--purple);
    }
    .checkout-branch-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .checkout-branch-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkout-phases-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: thin;
      align-items: flex-start;
    }
    .checkout-phase-col {
      min-width: 290px;
      max-width: 320px;
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .checkout-phase-header {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .checkout-tasks-flow {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* PASTEL CARDS */
    .pastel-card {
      border-radius: 9px;
      padding: 11px 13px;
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1.5px solid transparent;
      user-select: none;
    }
    .pastel-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    }

    /* Pastel Hecha / Completada (Verde suave completo) */
    .pastel-hecha {
      background: rgba(16, 185, 129, 0.13) !important;
      border-color: #10b981 !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-hecha {
      background: #ecfdf5 !important;
      border-color: #6ee7b7 !important;
      color: #064e3b !important;
    }

    /* Pastel En curso (Celeste / Azul suave completo) */
    .pastel-en-curso {
      background: rgba(59, 130, 246, 0.13) !important;
      border-color: #3b82f6 !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-en-curso {
      background: #eff6ff !important;
      border-color: #93c5fd !important;
      color: #1e3a8a !important;
    }

    /* Pastel En revisión (Púrpura / Lavanda suave completo) */
    .pastel-en-revision {
      background: rgba(168, 85, 247, 0.13) !important;
      border-color: #a855f7 !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-en-revision {
      background: #faf5ff !important;
      border-color: #d8b4fe !important;
      color: #581c87 !important;
    }

    /* Pastel Pendiente (Pizarra / Gris neutro suave) */
    .pastel-pendiente {
      background: rgba(148, 163, 184, 0.08) !important;
      border-color: var(--border) !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-pendiente {
      background: #f8fafc !important;
      border-color: #cbd5e1 !important;
      color: #334155 !important;
    }

    .pastel-blocked {
      border-left: 4px solid var(--danger) !important;
    }

    /* TABLES & WRAPPERS */
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: var(--bg-card);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 920px;
      width: 100%;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .modal-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
    .acceptance-banner {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .subtabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    /* PRINT */
    @media print {
      .topbar, .nav-tabs, .no-print { display: none !important; }
      body { background: #ffffff; color: #000000; }
      .card { box-shadow: none; border: 1px solid #999; break-inside: avoid; }
    }

    @media (max-width: 768px) {
      .main-container { padding: 10px; }
      .modal-panel { max-height: 96vh; }
    }
  </style>
</head>

- Regla crítica: con el Wi-Fi activo, el ADC2 deja de funcionar. Todo sensor analógico va en pines del ADC1 (GPIO 32, 33, 34, 35, 36, 39).

- Pulsador del humidificador [OPCIONAL]: Base transistor 2N2222 u optoacoplador PC817 -> GPIO 25.

    const STORAGE_KEY = "epn_iot_grupo1_camara_v2";

    const DataStore = {
      state: null,
      syncTimer: null,

      init() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            this.state = JSON.parse(raw);
          } catch (e) {
            this.state = crearDatosIniciales();
          }
        } else {
          this.state = crearDatosIniciales();
          this.save();
        }
        this.updateSyncBadge();
      },

      save() {
        this.state.ultima_actualizacion = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
        this.updateSyncBadge();
        if (this.state.config.firebase && this.state.config.firebase.activo) {
          clearTimeout(this.syncTimer);
          this.syncTimer = setTimeout(() => this.pushToFirebase(), 800);
        }
      },

      reset() {
        if (confirm("¿Estás seguro de restablecer todos los datos al Plan Maestro v2.0 inicial? Se sobrescribirá el estado actual.")) {
          this.state = crearDatosIniciales();
          this.save();
          App.render();
          alert("Datos restablecidos con éxito.");
        }
      },

      updateSyncBadge() {
        const el = document.getElementById("sync-indicator");
        if (!el) return;
        const fb = this.state?.config?.firebase;
        if (fb && fb.activo && fb.databaseURL) {
          el.className = "badge status-Hecha";
          el.innerHTML = `${Icons.cloud || ''} <span>Firebase Activo</span>`;
        } else {
          el.className = "badge status-Pendiente";
          el.innerHTML = `${Icons.storage || ''} <span>LocalStorage</span>`;
        }
      },

      async pushToFirebase() {
        const fb = this.state.config.firebase;
        if (!fb || !fb.activo || !fb.databaseURL) return;
        try {
          const clean = fb.databaseURL.replace(/\/$/, "");
          const auth = fb.secretToken ? `?auth=${encodeURIComponent(fb.secretToken)}` : "";
          const url = `${clean}/${fb.rutaNodo || "epn_iot_grupo1_camara"}.json${auth}`;
          const safeCopy = JSON.parse(JSON.stringify(this.state));
          // Evitar subir token local dentro del nodo público
          safeCopy.config.firebase = { activo: true, databaseURL: fb.databaseURL, rutaNodo: fb.rutaNodo };
          await fetch(url, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(safeCopy) });
        } catch (e) {
          console.warn("Fallo sync Firebase:", e);
        }
      },

      async pullFromFirebase() {
        const fb = this.state.config.firebase;
        if (!fb || !fb.databaseURL) {
          alert("Ingresa primero la URL de Firebase en Configuración.");
          return;
        }
        try {
          const clean = fb.databaseURL.replace(/\/$/, "");
          const auth = fb.secretToken ? `?auth=${encodeURIComponent(fb.secretToken)}` : "";
          const url = `${clean}/${fb.rutaNodo || "epn_iot_grupo1_camara"}.json${auth}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (data && data.tareas) {
            const fbLocal = { ...this.state.config.firebase };
            this.state = data;
            this.state.config.firebase = fbLocal;
            this.save();
            App.render();
            alert("Datos descargados correctamente de Firebase.");
          } else {
            alert("El nodo en Firebase está vacío. Usa 'Subir a Firebase' primero.");
          }
        } catch (e) {
          alert("Error descargando de Firebase: " + e.message);
        }
      }
    };

    const Logic = {
      getTaskProgress(t) {
        if (!t.pasos || t.pasos.length === 0) return t.estado === "Hecha" ? 100 : 0;
        const hechos = t.pasos.filter(p => p.hecho).length;
        return Math.round((hechos / t.pasos.length) * 100);
      },

      isTaskBlocked(t) {
        if (!t.depende_de || t.depende_de.length === 0) return false;
        return t.depende_de.some(depId => {
          const dep = DataStore.state.tareas.find(x => x.id === depId);
          return dep && dep.estado !== "Hecha";
        });
      },

      getBlockingIds(t) {
        if (!t.depende_de) return [];
        return t.depende_de.filter(depId => {
          const dep = DataStore.state.tareas.find(x => x.id === depId);
          return dep && dep.estado !== "Hecha";
        });
      },

      isTaskOverdue(t) {
        if (t.estado === "Hecha") return false;
        const hoy = new Date().toISOString().slice(0, 10);
        return t.fecha_fin && t.fecha_fin < hoy;
      },

      getWeightedProgress(lista) {
        if (!lista || lista.length === 0) return 0;
        let totalP = 0, sumP = 0;
        lista.forEach(t => {
          const peso = Math.max(1, (t.pasos ? t.pasos.length : 1));
          totalP += peso;
          sumP += this.getTaskProgress(t) * peso;
        });
        return totalP === 0 ? 0 : Math.round(sumP / totalP);
      },

      formatMemberName(rol) {
        const m = DataStore.state.config.integrantes;
        if (m && m[rol] && m[rol].nombre && m[rol].nombre !== rol) {
          return `${rol} (${m[rol].nombre})`;
        }
        return rol;
      },

      taskBelongsToUser(t, u) {
        if (!u || u === "Todos") return true;
        if (t.rol_responsable === "Todos") return true;
        const m = DataStore.state.config.integrantes;
        for (const [rolKey, val] of Object.entries(m || {})) {
          if ((u === rolKey || u === val.nombre) && (t.rol_responsable.includes(rolKey) || t.rol_responsable.includes(val.nombre))) {
            return true;
          }
        }
        return t.rol_responsable.includes(u);
      },

      changeTaskStatus(taskId, nuevoEstado) {
        const t = DataStore.state.tareas.find(x => x.id === taskId);
        if (!t || t.estado === nuevoEstado) return false;

        // Alerta de bloqueo
        if (nuevoEstado !== "Pendiente" && this.isTaskBlocked(t)) {
          const f = this.getBlockingIds(t).join(", ");
          const ok = confirm(`[TAREA BLOQUEADA] ${t.id} depende de [${f}] no terminadas.\n\n¿Deseas avanzar el estado a "${nuevoEstado}" con confirmación?`);
          if (!ok) return false;
        }

        // Criterio de aceptación
        if (nuevoEstado === "Hecha" && !t.criterio_aprobado) {
          const ok = confirm(`[CRITERIO PENDIENTE]\n"${t.criterio_aceptacion}"\n\n¿Deseas aprobar el criterio y marcar la tarea como Hecha?`);
          if (!ok) return false;
          t.criterio_aprobado = true;
        }

        const ant = t.estado;
        t.estado = nuevoEstado;
        t.actualizada = new Date().toISOString();
        const aut = DataStore.state.config.usuario_actual || "Equipo";
        t.historial.unshift({ fecha: t.actualizada, autor: aut, cambio: `Estado: "${ant}" -> "${nuevoEstado}"` });
        DataStore.save();
        return true;
      },

      recalcularFechas() {
        const p1 = DataStore.state.config.fecha_inicio_p1 || "2026-10-19";
        const p2 = DataStore.state.config.fecha_inicio_p2 || "2026-11-30";
        const sumar = (f, d) => {
          const dt = new Date(f + "T00:00:00");
          dt.setDate(dt.getDate() + d);
          return dt.toISOString().slice(0, 10);
        };
        DataStore.state.tareas.forEach(t => {
          const base = t.parte === 1 ? p1 : p2;
          t.fecha_inicio = sumar(base, (t.semana_inicio - 1) * 7);
          t.fecha_fin = sumar(base, t.semana_fin * 7 - 1);
        });
        DataStore.save();
      },

      calcularRutaCritica() {
        const tareas = DataStore.state.tareas;
        const nodes = {};
        tareas.forEach(t => {
          const dur = Math.max(1, (t.semana_fin - t.semana_inicio + 1));
          nodes[t.id] = { id: t.id, dur, es: 0, ef: dur, ls: Infinity, lf: Infinity, deps: t.depende_de || [] };
        });

        let changed = true, g = 0;
        while (changed && g++ < 100) {
          changed = false;
          tareas.forEach(t => {
            const n = nodes[t.id];
            let maxEf = 0;
            n.deps.forEach(d => { if (nodes[d] && nodes[d].ef > maxEf) maxEf = nodes[d].ef; });
            const es = maxEf, ef = es + n.dur;
            if (es !== n.es || ef !== n.ef) { n.es = es; n.ef = ef; changed = true; }
          });
        }

        const maxTot = Math.max(...Object.values(nodes).map(x => x.ef), 1);
        Object.values(nodes).forEach(n => { n.lf = maxTot; n.ls = n.lf - n.dur; });

        changed = true; g = 0;
        while (changed && g++ < 100) {
          changed = false;
          tareas.forEach(t => {
            const n = nodes[t.id];
            const succ = tareas.filter(s => (s.depende_de || []).includes(n.id));
            if (succ.length > 0) {
              const minLs = Math.min(...succ.map(s => nodes[s.id].ls));
              if (minLs !== n.lf) { n.lf = minLs; n.ls = n.lf - n.dur; changed = true; }
            }
          });
        }

        const criticos = new Set();
        Object.values(nodes).forEach(n => {
          if (Math.abs(n.ls - n.es) < 0.001) criticos.add(n.id);
        });
        return { criticos, nodes, totalSemanas: maxTot };
      },

      calcularMapADC(adc, aire, agua) {
        const a = Number(adc), sAire = Number(aire), sAgua = Number(agua);
        if (sAire === sAgua) return 0;
        const r = ((a - sAire) * 100) / (sAgua - sAire);
        return Math.max(0, Math.min(100, Math.round(r * 10) / 10));
      }
    };

        if (isHecha) {
          pastelClass = "pastel-hecha";
          statusBadge = `<span style="font-size:11px; font-weight:800; color:var(--accent); display:inline-flex; align-items:center; gap:4px;">${Icons.checkCircle} Realizada</span>`;
        } else if (isEnCurso) {
          pastelClass = "pastel-en-curso";
          statusBadge = `<span style="font-size:11px; font-weight:800; color:var(--info); display:inline-flex; align-items:center; gap:4px;">${Icons.clock} En curso (${prog}%)</span>`;
        } else if (isEnRevision) {
          pastelClass = "pastel-en-revision";
          statusBadge = `<span style="font-size:11px; font-weight:800; color:var(--purple); display:inline-flex; align-items:center; gap:4px;">${Icons.user} En revisión</span>`;
        }

        if (isBloq) {
          statusBadge += ` <span style="font-size:11px; font-weight:700; color:var(--danger); display:inline-flex; align-items:center; gap:3px;">${Icons.lock} Bloqueada</span>`;
        }

        return `
          <div class="pastel-card ${pastelClass} ${isBloq ? 'pastel-blocked' : ''}" onclick="App.openTaskModal('${t.id}')">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
              <span style="font-family:monospace; font-weight:800; font-size:12px; color:var(--accent);">${t.id}</span>
              ${statusBadge}
            </div>
            <div style="font-weight:700; font-size:13px; line-height:1.35; margin:3px 0;">
              ${this.escapeHtml(t.titulo)}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px; font-size:11.5px;">
              <span style="display:inline-flex; align-items:center; gap:4px; opacity:0.9;">
                ${Icons.user} ${this.escapeHtml(respNombre)}
              </span>
              <span style="font-size:11px; opacity:0.75;">S${t.semana_inicio}-S${t.semana_fin}</span>
            </div>
            <div class="progress-wrap" style="height:6px; margin-top:5px;">
              <div class="progress-bar" style="width:${prog}%; ${isHecha ? 'background:var(--accent);' : (isEnCurso ? 'background:var(--info);' : '')}"></div>
            </div>
          </div>
        `;
      },

      switchTab(tab) {
        this.currentTab = tab;
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.getAttribute("data-tab") === tab));
        this.render();
      },

      setActiveUser(u) {
        DataStore.state.config.usuario_actual = u;
        DataStore.save();
        this.render();
      },

      setTreeFilter(f) {
        this.treeFilter = f;
        this.render();
      },

      toggleTheme() {
        const t = DataStore.state.config.tema === "claro" ? "oscuro" : "claro";
        DataStore.state.config.tema = t;
        document.documentElement.setAttribute("data-theme", t);
        DataStore.save();
      },

      render() {
        const c = document.getElementById("app-view");
        if (!c) return;
        const i1 = Logic.formatMemberName("Integrante 1");
        const i2 = Logic.formatMemberName("Integrante 2");
        const i3 = Logic.formatMemberName("Integrante 3");
        document.getElementById("topbar-subtitle").textContent =
          `${DataStore.state.config.asignatura} • ${DataStore.state.config.docente} • ${i1} | ${i2} | ${i3}`;

        switch (this.currentTab) {
          case "arbol": c.innerHTML = this.renderVistaArbol(); break;
          case "panel": c.innerHTML = this.renderPanelPrincipal(); break;
          case "tablero": c.innerHTML = this.renderVistaTablero(); break;
          case "cronograma": c.innerHTML = this.renderVistaCronograma(); break;
          case "semana": c.innerHTML = this.renderVistaSemana(); break;
          case "dependencias": c.innerHTML = this.renderVistaDependencias(); break;
          case "bitacora": c.innerHTML = this.renderVistaBitacora(); break;
          case "compras": c.innerHTML = this.renderVistaCompras(); break;
          case "listas": c.innerHTML = this.renderVistaListas(); break;
          case "referencia": c.innerHTML = this.renderVistaReferencia(); break;
          case "config": c.innerHTML = this.renderVistaConfig(); break;
        }
      },

      /* ========================================================================
         2. VISTA ÁRBOL — LÍNEAS DE CHECKOUT DE IZQUIERDA A DERECHA (HORIZONTAL)
         ======================================================================== */
      renderVistaArbol() {
        const st = DataStore.state;
        const tareas = st.tareas;
        const p1 = tareas.filter(t => t.parte === 1);
        const p2 = tareas.filter(t => t.parte === 2);
        const progTotal = Logic.getWeightedProgress(tareas);
        const progP1 = Logic.getWeightedProgress(p1);
        const progP2 = Logic.getWeightedProgress(p2);
        const u = st.config.usuario_actual || "Todos";

        const fasesP1 = [...new Set(p1.map(t => t.fase))];
        const fasesP2 = [...new Set(p2.map(t => t.fase))];

        return `
          <div class="checkout-tree-container">
            <!-- Barra de control y filtros del árbol -->
            <div style="display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap;">
              <div>
                <h2 style="font-size:18px; font-weight:800; display:flex; align-items:center; gap:8px;">
                  ${Icons.tree}
                  <span>Ruta en Árbol — Ramas de Checkout de Izquierda a Derecha</span>
                </h2>
                <p style="font-size:12.5px; color:var(--text-muted); margin-top:3px;">
                  Flujo horizontal continuo por fases. Las tareas se pintan en color pastel (las realizadas no desaparecen). Toca cualquier tarjeta para ver sus pasos y criterio.
                </p>
              </div>

              <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                <button class="btn btn-sm ${this.treeFilter === 'todos' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('todos')">Todo el Proyecto</button>
                <button class="btn btn-sm ${this.treeFilter === 'mis' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('mis')">Solo Mis Tareas (${this.escapeHtml(u)})</button>
                <button class="btn btn-sm ${this.treeFilter === 'p1' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('p1')">Parte 1 (1er Bimestre)</button>
                <button class="btn btn-sm ${this.treeFilter === 'p2' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('p2')">Parte 2 (2do Bimestre)</button>
              </div>
            </div>

            <!-- NODO RAÍZ PRINCIPAL -->
            <div style="display:flex; align-items:center; gap:16px; margin-bottom:26px;">
              <div class="checkout-root-node">
                <div style="width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;">
                  ${Icons.leaf}
                </div>
                <div>
                  <div style="font-size:14px; font-weight:800;">Cámara de Germinación Inteligente IoT</div>
                  <div style="font-size:11px; color:var(--text-muted);">Grupo 1 • EPN 2026-B</div>
                </div>
                <div style="margin-left:10px; background:var(--accent-soft); color:var(--accent); padding:3px 9px; border-radius:6px; font-size:12px; font-weight:700;">
                  ${progTotal}% Avance
                </div>
              </div>
              <div style="flex:1; height:2px; background:linear-gradient(90deg, var(--accent), var(--border));"></div>
            </div>

            <!-- RAMA SUPERIOR: PARTE 1 (PRIMER BIMESTRE) -->
            ${(this.treeFilter === 'todos' || this.treeFilter === 'mis' || this.treeFilter === 'p1') ? `
              <div class="checkout-branch parte-1">
                <div class="checkout-branch-header">
                  <div class="checkout-branch-title" style="color:var(--info);">
                    <span style="width:12px; height:12px; border-radius:50%; background:var(--info); display:inline-block;"></span>
                    <span>PARTE 1: Prototipo en Protoboard y Lote Piloto (1er Bimestre)</span>
                  </div>
                  <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:12px; font-weight:700; color:var(--info);">${progP1}% Completado</span>
                    <div class="progress-wrap" style="width:90px;"><div class="progress-bar" style="width:${progP1}%; background:var(--info);"></div></div>
                  </div>
                </div>

                <!-- Pista horizontal de fases de izquierda a derecha -->
                <div class="checkout-phases-track">
                  ${fasesP1.map((faseNombre, idx) => {
                    let tFase = p1.filter(t => t.fase === faseNombre);
                    if (this.treeFilter === 'mis' && u !== "Todos") {
                      tFase = tFase.filter(t => Logic.taskBelongsToUser(t, u));
                    }
                    if (tFase.length === 0) return '';
                    const progFase = Logic.getWeightedProgress(tFase);
                    return `
                      <div class="checkout-phase-col">
                        <div class="checkout-phase-header">
                          <span title="${this.escapeHtml(faseNombre)}">Fase ${idx + 1}: ${this.escapeHtml(faseNombre)}</span>
                          <span style="font-size:11px; color:var(--text-muted); font-weight:700;">${progFase}%</span>
                        </div>
                        <div class="checkout-tasks-flow">
                          ${tFase.map(t => this.renderPastelTaskCard(t)).join("")}
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            ` : ''}

            <!-- RAMA INFERIOR: PARTE 2 (SEGUNDO BIMESTRE) -->
            ${(this.treeFilter === 'todos' || this.treeFilter === 'mis' || this.treeFilter === 'p2') ? `
              <div class="checkout-branch parte-2">
                <div class="checkout-branch-header">
                  <div class="checkout-branch-title" style="color:var(--purple);">
                    <span style="width:12px; height:12px; border-radius:50%; background:var(--purple); display:inline-block;"></span>
                    <span>PARTE 2: Prototipo Final en PCB, Acrílico y Visión (2do Bimestre)</span>
                  </div>
                  <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:12px; font-weight:700; color:var(--purple);">${progP2}% Completado</span>
                    <div class="progress-wrap" style="width:90px;"><div class="progress-bar" style="width:${progP2}%; background:var(--purple);"></div></div>
                  </div>
                </div>

                <!-- Pista horizontal de fases de izquierda a derecha -->
                <div class="checkout-phases-track">
                  ${fasesP2.map((faseNombre, idx) => {
                    let tFase = p2.filter(t => t.fase === faseNombre);
                    if (this.treeFilter === 'mis' && u !== "Todos") {
                      tFase = tFase.filter(t => Logic.taskBelongsToUser(t, u));
                    }
                    if (tFase.length === 0) return '';
                    const progFase = Logic.getWeightedProgress(tFase);
                    return `
                      <div class="checkout-phase-col">
                        <div class="checkout-phase-header">
                          <span title="${this.escapeHtml(faseNombre)}">Fase ${idx + 1}: ${this.escapeHtml(faseNombre)}</span>
                          <span style="font-size:11px; color:var(--text-muted); font-weight:700;">${progFase}%</span>
                        </div>
                        <div class="checkout-tasks-flow">
                          ${tFase.map(t => this.renderPastelTaskCard(t)).join("")}
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      },

      /* ========================================================================
         1. PANEL PRINCIPAL — ENFOQUE LIMPIO ("¿CON QUÉ EMPEZAMOS HOY?")
         ======================================================================== */
      renderPanelPrincipal() {
        const st = DataStore.state;
        const tareas = st.tareas;
        const u = st.config.usuario_actual || "Todos";
        const sActiva = Number(st.config.semana_actual_p1 || 1);
        const pActiva = Number(st.config.parte_activa_semana || 1);

        // Tareas de la semana activa: SE MUESTRAN TODAS (las hechas en verde pastel, no se ocultan)
        let tareasSemana = tareas.filter(t => t.parte === pActiva && t.semana_inicio <= sActiva && t.semana_fin >= sActiva);

        const totalHechas = tareas.filter(t => t.estado === "Hecha").length;
        const totalEnCurso = tareas.filter(t => t.estado === "En curso").length;
        const progTotal = Logic.getWeightedProgress(tareas);

        return `
          <!-- HERO DE ENFOQUE ZEN -->
          <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:var(--shadow);">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
              <div>
                <div style="font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--accent); font-weight:700;">
                  Plan de Trabajo Activo
                </div>
                <h1 style="font-size:22px; font-weight:800; margin:4px 0;">
                  ¿Con qué empezamos hoy?
                </h1>
                <p style="font-size:13.5px; color:var(--text-muted);">
                  Integrante activo: <strong style="color:var(--text-main);">${this.escapeHtml(u)}</strong> • Parte ${pActiva} (Semana ${sActiva})
                </p>
              </div>

              <!-- Botón directo al Árbol de Checkout Horizontal -->
              <button onclick="App.switchTab('arbol')" class="btn btn-primary" style="padding:10px 18px; font-size:13.5px; gap:8px;">
                ${Icons.tree}
                <span>Ver Árbol de Checkout (Ramas)</span>
              </button>
            </div>

            <!-- Métricas sobrias de salud del proyecto (sin saturación) -->
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-top:18px; padding-top:16px; border-top:1px solid var(--border);">
              <div style="display:flex; align-items:center; gap:10px;">
                <div style="font-size:24px; font-weight:800; color:var(--accent);">${progTotal}%</div>
                <div style="font-size:12px; color:var(--text-muted); line-height:1.2;">Avance General del Proyecto</div>
              </div>
              <div style="display:flex; align-items:center; gap:10px;">
                <div style="font-size:24px; font-weight:800; color:var(--accent);">${totalHechas}</div>
                <div style="font-size:12px; color:var(--text-muted); line-height:1.2;">Tareas Realizadas (visibles en verde)</div>
              </div>
              <div style="display:flex; align-items:center; gap:10px;">
                <div style="font-size:24px; font-weight:800; color:var(--info);">${totalEnCurso}</div>
                <div style="font-size:12px; color:var(--text-muted); line-height:1.2;">Tareas En Curso</div>
              </div>
            </div>
          </div>

          <!-- SECCIÓN: TAREAS DE LA SEMANA ACTIVA (TARJETAS PASTEL COMPLETAS) -->
          <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:var(--shadow);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
              <div style="display:flex; align-items:center; gap:8px;">
                <h2 style="font-size:16px; font-weight:800; display:flex; align-items:center; gap:6px;">
                  ${Icons.calendar}
                  <span>Tareas para la Semana ${sActiva}</span>
                </h2>
                <span class="badge tag-PDF">Parte ${pActiva}</span>
              </div>
              <div style="display:flex; gap:6px; align-items:center;">
                <span style="font-size:12px; color:var(--text-muted); margin-right:4px;">Cambiar semana:</span>
                <button class="btn btn-sm" onclick="App.cambiarSemanaActiva(-1)">◀ S${Math.max(1, sActiva - 1)}</button>
                <button class="btn btn-sm" onclick="App.cambiarSemanaActiva(1)">S${Math.min(9, sActiva + 1)} ▶</button>
              </div>
            </div>

            ${tareasSemana.length === 0 ? `
              <div style="text-align:center; padding:32px; color:var(--text-muted);">
                <p>No hay tareas programadas para la Semana ${sActiva}. Navega entre semanas con los botones de arriba.</p>
              </div>
            ` : `
              <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:14px;">
                ${tareasSemana.map(t => this.renderPastelTaskCard(t)).join("")}
              </div>
            `}
          </div>

          <!-- ACCESOS RÁPIDOS COMPACTOS -->
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px;">
            <div class="card" onclick="App.switchTab('bitacora')" style="cursor:pointer;">
              <div class="card-header">
                <div class="card-title">${Icons.book} Bitácora de Laboratorio</div>
                <span class="badge tag-PDF">Calibración & Germinación</span>
              </div>
              <p style="font-size:13px; color:var(--text-muted);">
                Conversión ADC del sensor capacitivo en tiempo real y curva gráfica de germinación del lote piloto.
              </p>
            </div>

            <div class="card" onclick="App.switchTab('compras')" style="cursor:pointer;">
              <div class="card-header">
                <div class="card-title">${Icons.cart} Compras y Tienda</div>
                <span class="badge tag-DISENO">Secciones 6 & 18</span>
              </div>
              <p style="font-size:13px; color:var(--text-muted);">
                Lista de materiales con cantidades, precios y checklist de pruebas en tienda (humidificador a 5 V directos).
              </p>
            </div>
          </div>
        `;
      },

      cambiarSemanaActiva(delta) {
        let s = Number(DataStore.state.config.semana_actual_p1 || 1) + delta;
        if (s < 1) s = 1;
        if (s > 9) s = 9;
        DataStore.state.config.semana_actual_p1 = s;
        DataStore.save();
        this.render();
      },

      toggleVerificacion(id) {
        const v = DataStore.state.verificaciones_pendientes.find(x => x.id === id);
        if (v) {
          v.cerrado = !v.cerrado;
          DataStore.save();
          this.render();
        }
      },

      /* ========================================================================
         3. VISTA TABLERO (KANBAN CON TARJETAS PASTEL)
         ======================================================================== */
      renderVistaTablero() {
        const st = DataStore.state;
        const f = this.kanbanFilters;
        let lista = st.tareas.filter(t => {
          if (f.parte !== "todas" && t.parte !== Number(f.parte)) return false;
          if (f.responsable !== "todos" && !Logic.taskBelongsToUser(t, f.responsable)) return false;
          if (f.etiqueta !== "todas" && !(t.etiquetas || []).includes(f.etiqueta)) return false;
          if (f.busqueda) {
            const q = f.busqueda.toLowerCase();
            const txt = (t.id + " " + t.titulo + " " + t.descripcion).toLowerCase();
            if (!txt.includes(q)) return false;
          }
          return true;
        });

        const estados = ["Pendiente", "En curso", "En revisión", "Hecha"];

        return `
          <div class="card" style="margin-bottom:14px;">
            <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
              <div style="flex:1; min-width:200px;">
                <input type="text" placeholder="Buscar por ID, título o descripción..." value="${this.escapeHtml(f.busqueda)}" oninput="App.filtrarKanban('busqueda', this.value)" />
              </div>
              <div style="width:160px;">
                <select onchange="App.filtrarKanban('parte', this.value)">
                  <option value="todas" ${f.parte === 'todas' ? 'selected' : ''}>Todas las Partes</option>
                  <option value="1" ${f.parte === '1' ? 'selected' : ''}>Parte 1 (T1)</option>
                  <option value="2" ${f.parte === '2' ? 'selected' : ''}>Parte 2 (T2)</option>
                </select>
              </div>
              <div style="width:180px;">
                <select onchange="App.filtrarKanban('responsable', this.value)">
                  <option value="todos" ${f.responsable === 'todos' ? 'selected' : ''}>Todos los responsables</option>
                  <option value="Integrante 1" ${f.responsable === 'Integrante 1' ? 'selected' : ''}>${this.escapeHtml(Logic.formatMemberName('Integrante 1'))}</option>
                  <option value="Integrante 2" ${f.responsable === 'Integrante 2' ? 'selected' : ''}>${this.escapeHtml(Logic.formatMemberName('Integrante 2'))}</option>
                  <option value="Integrante 3" ${f.responsable === 'Integrante 3' ? 'selected' : ''}>${this.escapeHtml(Logic.formatMemberName('Integrante 3'))}</option>
                </select>
              </div>
              <div style="width:160px;">
                <select onchange="App.filtrarKanban('etiqueta', this.value)">
                  <option value="todas">Todas las etiquetas</option>
                  <option value="[PDF]" ${f.etiqueta === '[PDF]' ? 'selected' : ''}>[PDF]</option>
                  <option value="[DISEÑO]" ${f.etiqueta === '[DISEÑO]' ? 'selected' : ''}>[DISEÑO]</option>
                  <option value="[A VERIFICAR]" ${f.etiqueta === '[A VERIFICAR]' ? 'selected' : ''}>[A VERIFICAR]</option>
                  <option value="[OPCIONAL]" ${f.etiqueta === '[OPCIONAL]' ? 'selected' : ''}>[OPCIONAL]</option>
                </select>
              </div>
            </div>
          </div>

          <div class="kanban-board">
            ${estados.map(est => {
              const items = lista.filter(t => t.estado === est);
              return `
                <div class="kanban-col">
                  <div class="kanban-col-header">
                    <span>${est}</span>
                    <span class="badge status-${est.replace(/\s+/g, '-').replace('ó', 'o')}">${items.length}</span>
                  </div>
                  <div class="kanban-dropzone" ondragover="event.preventDefault(); this.classList.add('drag-over');" ondragleave="this.classList.remove('drag-over');" ondrop="App.handleKanbanDrop(event, '${est}')">
                    ${items.map(t => {
                      const bloq = Logic.isTaskBlocked(t) && t.estado !== "Hecha";
                      let pastelClass = "pastel-pendiente";
                      if (est === "Hecha") pastelClass = "pastel-hecha";
                      else if (est === "En curso") pastelClass = "pastel-en-curso";
                      else if (est === "En revisión") pastelClass = "pastel-en-revision";

                      return `
                        <div class="pastel-card ${pastelClass} ${bloq ? 'pastel-blocked' : ''}" style="margin-bottom:8px;" draggable="true" ondragstart="event.dataTransfer.setData('text/plain', '${t.id}')" onclick="App.openTaskModal('${t.id}')">
                          <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-family:monospace; font-weight:800; font-size:12px; color:var(--accent);">${t.id}</span>
                            <span style="font-size:11px; opacity:0.75;">S${t.semana_inicio}-S${t.semana_fin}</span>
                          </div>
                          <div style="font-weight:700; margin:4px 0; font-size:13px; line-height:1.3;">${this.escapeHtml(t.titulo)}</div>
                          <div style="margin-bottom:6px;">${this.renderBadges(t.etiquetas)}</div>
                          <div class="progress-wrap" style="height:6px;"><div class="progress-bar" style="width:${Logic.getTaskProgress(t)}%"></div></div>
                          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:11.5px; opacity:0.85;">
                            <span style="display:inline-flex; align-items:center; gap:4px;">${Icons.user} ${this.escapeHtml(t.rol_responsable)}</span>
                            ${bloq ? `<span style="color:var(--danger); font-weight:700; display:inline-flex; align-items:center; gap:3px;">${Icons.lock} Bloqueada</span>` : `<span>${t.pasos.filter(p => p.hecho).length}/${t.pasos.length}</span>`}
                          </div>
                          <div style="display:flex; gap:4px; margin-top:6px;" onclick="event.stopPropagation();">
                            ${estados.filter(x => x !== est).map(dest => `
                              <button class="btn btn-sm" style="flex:1; padding:2px; font-size:11px;" onclick="App.moverEstadoRapido('${t.id}', '${dest}')" title="Mover a ${dest}">&rarr; ${dest.slice(0, 4)}</button>
                            `).join("")}
                          </div>
                        </div>
                      `;
                    }).join("")}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      },

      filtrarKanban(k, v) {
        this.kanbanFilters[k] = v;
        this.render();
      },
      handleKanbanDrop(e, nuevoEstado) {
        e.preventDefault();
        e.currentTarget.classList.remove("drag-over");
        const id = e.dataTransfer.getData("text/plain");
        if (id) {
          Logic.changeTaskStatus(id, nuevoEstado);
          this.render();
        }
      },
      moverEstadoRapido(id, nuevoEstado) {
        Logic.changeTaskStatus(id, nuevoEstado);
        this.render();
      },

      /* 4. VISTA CRONOGRAMA (GANTT) */
      renderVistaCronograma() {
        const st = DataStore.state;
        const tareas = st.tareas;
        const hoy = new Date().toISOString().slice(0, 10);
        const { criticos } = Logic.calcularRutaCritica();

        return `
          <div class="card" style="margin-bottom:14px;">
            <div class="card-header">
              <div class="card-title">${Icons.gantt} Cronograma Relativo (Gantt) y Fechas Reales</div>
              <button class="btn btn-sm btn-primary no-print" onclick="window.print()" style="gap:5px;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                <span>Versión Imprimible</span>
              </button>
            </div>
            <div class="grid-3" style="margin-bottom:12px;">
              <div>
                <label style="font-size:12px; font-weight:700;">Fecha Inicio Parte 1:</label>
                <input type="date" value="${st.config.fecha_inicio_p1 || '2026-10-19'}" onchange="App.actualizarFechaInicio(1, this.value)" />
              </div>
              <div>
                <label style="font-size:12px; font-weight:700;">Fecha Inicio Parte 2:</label>
                <input type="date" value="${st.config.fecha_inicio_p2 || '2026-11-30'}" onchange="App.actualizarFechaInicio(2, this.value)" />
              </div>
              <div style="display:flex; align-items:flex-end;">
                <button class="btn btn-sm" onclick="App.recalcularFechasBoton()">Recalcular Fechas de Tareas</button>
              </div>
            </div>
            <div style="font-size:12px; color:var(--text-muted);">
              Semanas relativas: Parte 1 (Semana 1 a 6) | Parte 2 (Semana 1 a 9). Hoy es ${hoy}. Tareas con borde dorado pertenecen a la Ruta Crítica.
            </div>
          </div>

          <div class="card">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width:75px;">ID</th>
                    <th style="min-width:180px;">Tarea</th>
                    <th style="width:110px;">Responsable</th>
                    <th style="width:70px;">Semana</th>
                    <th style="width:90px;">Inicio</th>
                    <th style="width:90px;">Fin</th>
                    <th style="width:85px;">Estado</th>
                    <th style="min-width:320px;">Barras por Semana (S1 a S9)</th>
                  </tr>
                </thead>
                <tbody>
                  ${tareas.map(t => {
                    const esCritica = criticos.has(t.id);
                    const maxS = t.parte === 1 ? 6 : 9;
                    const leftPct = ((t.semana_inicio - 1) / maxS) * 100;
                    const widthPct = Math.max(8, ((t.semana_fin - t.semana_inicio + 1) / maxS) * 100);
                    const colorBar = t.estado === "Hecha" ? "var(--accent)" : (t.parte === 1 ? "var(--info)" : "var(--purple)");

                    return `
                      <tr style="cursor:pointer;" onclick="App.openTaskModal('${t.id}')">
                        <td><span class="task-id">${t.id}</span></td>
                        <td>
                          <strong>${this.escapeHtml(t.titulo)}</strong>
                          ${esCritica ? `<span class="badge tag-VERIFICAR" style="margin-left:4px;">Ruta Crítica</span>` : ""}
                        </td>
                        <td><span style="font-size:11.5px;">${this.escapeHtml(t.rol_responsable)}</span></td>
                        <td>
                          <span style="font-size:12px;">P${t.parte} S${t.semana_inicio}-${t.semana_fin}</span>
                        </td>
                        <td style="font-size:11.5px;">${t.fecha_inicio}</td>
                        <td style="font-size:11.5px;">${t.fecha_fin}</td>
                        <td>${this.renderStatusBadge(t)}</td>
                        <td>
                          <div style="position:relative; width:100%; height:22px; background:var(--bg-input); border-radius:5px; border:1px solid var(--border);">
                            <div style="position:absolute; left:${leftPct}%; width:${widthPct}%; height:100%; background:${colorBar}; border-radius:4px; opacity:0.85; border:${esCritica ? '2px solid #fbbf24' : 'none'}; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff;">
                              ${Logic.getTaskProgress(t)}%
                            </div>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },

      actualizarFechaInicio(parte, val) {
        if (!val) return;
        if (parte === 1) DataStore.state.config.fecha_inicio_p1 = val;
        else DataStore.state.config.fecha_inicio_p2 = val;
        Logic.recalcularFechas();
        this.render();
      },

      recalcularFechasBoton() {
        Logic.recalcularFechas();
        this.render();
        alert("Fechas recalculadas automáticamente.");
      },

      /* 5. VISTA SEMANA Y HOY */
      renderVistaSemana() {
        const st = DataStore.state;
        const rut = st.rutinas_hoy || {};
        const semana = Number(st.config.semana_actual_p1 || 1);
        const parte = Number(st.config.parte_activa_semana || 1);
        const tareasSem = st.tareas.filter(t => t.parte === parte && t.semana_inicio <= semana && t.semana_fin >= semana);

        return `
          <div class="grid-2" style="margin-bottom:16px;">
            <!-- VISTA HOY -->
            <div class="card">
              <div class="card-header">
                <div class="card-title" style="display:flex; align-items:center; gap:6px;">${Icons.calendar} Vista "Hoy" — Checklist Operativo Diario</div>
                <span class="badge tag-PDF">Protocolo Piloto</span>
              </div>
              <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">
                Rutinas recurrentes obligatorias del documento durante el lote piloto y el desarrollo:
              </p>
              <div style="display:flex; flex-direction:column; gap:8px;">
                <label style="display:flex; align-items:center; gap:8px; padding:6px; background:var(--bg-card); border-radius:6px;">
                  <input type="checkbox" ${rut.agua_piloto ? 'checked' : ''} onchange="App.toggleRutina('agua_piloto', this.checked)" />
                  <span><strong>Revisar nivel de agua del lote piloto</strong> (el humidificador nunca debe operar en seco).</span>
                </label>
                <div style="padding:6px; background:var(--bg-card); border-radius:6px;">
                  <div style="font-size:12px; font-weight:700; margin-bottom:4px;">Captura de fotos del piloto (2 a 4 veces al día):</div>
                  <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;">
                    <label style="display:flex; align-items:center; gap:4px; font-size:12px;">
                      <input type="checkbox" ${rut.foto_00 ? 'checked' : ''} onchange="App.toggleRutina('foto_00', this.checked)" /> 00:00 h
                    </label>
                    <label style="display:flex; align-items:center; gap:4px; font-size:12px;">
                      <input type="checkbox" ${rut.foto_06 ? 'checked' : ''} onchange="App.toggleRutina('foto_06', this.checked)" /> 06:00 h
                    </label>
                    <label style="display:flex; align-items:center; gap:4px; font-size:12px;">
                      <input type="checkbox" ${rut.foto_12 ? 'checked' : ''} onchange="App.toggleRutina('foto_12', this.checked)" /> 12:00 h
                    </label>
                    <label style="display:flex; align-items:center; gap:4px; font-size:12px;">
                      <input type="checkbox" ${rut.foto_18 ? 'checked' : ''} onchange="App.toggleRutina('foto_18', this.checked)" /> 18:00 h
                    </label>
                  </div>
                </div>
                <label style="display:flex; align-items:center; gap:8px; padding:6px; background:var(--bg-card); border-radius:6px;">
                  <input type="checkbox" ${rut.receptor_activo ? 'checked' : ''} onchange="App.toggleRutina('receptor_activo', this.checked)" />
                  <span><strong>Receptor y Mosquitto encendidos</strong> (laptop sin suspensión guardando telemetría).</span>
                </label>
                <label style="display:flex; align-items:center; gap:8px; padding:6px; background:var(--bg-card); border-radius:6px;">
                  <input type="checkbox" ${rut.conteo_radiculas ? 'checked' : ''} onchange="App.toggleRutina('conteo_radiculas', this.checked)" />
                  <span><strong>Conteo de radículas en fotos y bitácora</strong> (Integrante 3 cruza con Firebase).</span>
                </label>
                <label style="display:flex; align-items:center; gap:8px; padding:6px; background:var(--bg-card); border-radius:6px;">
                  <input type="checkbox" ${rut.reunion_equipo ? 'checked' : ''} onchange="App.toggleRutina('reunion_equipo', this.checked)" />
                  <span><strong>Reunión corta del equipo (15-20 min)</strong> (dos veces por semana).</span>
                </label>
              </div>
            </div>

            <!-- CUADRÍCULA SEMANAL POR INTEGRANTE -->
            <div class="card">
              <div class="card-header">
                <div class="card-title">${Icons.calendar} Horario Semanal — Parte ${parte}, Semana ${semana}</div>
                <div style="display:flex; gap:6px;">
                  <select style="width:auto;" onchange="App.cambiarParteSemana(this.value)">
                    <option value="1" ${parte === 1 ? 'selected' : ''}>Parte 1</option>
                    <option value="2" ${parte === 2 ? 'selected' : ''}>Parte 2</option>
                  </select>
                  <select style="width:auto;" onchange="App.cambiarNumeroSemana(this.value)">
                    ${[1,2,3,4,5,6,7,8,9].map(num => `
                      <option value="${num}" ${semana === num ? 'selected' : ''}>Semana ${num}</option>
                    `).join("")}
                  </select>
                </div>
              </div>

              ${["Integrante 1", "Integrante 2", "Integrante 3"].map(rol => {
                const tareasRol = tareasSem.filter(t => Logic.taskBelongsToUser(t, rol));
                return `
                  <div style="margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border);">
                    <div style="font-weight:700; color:var(--accent);">${this.escapeHtml(Logic.formatMemberName(rol))}</div>
                    <div style="font-size:11.5px; color:var(--text-muted); margin-bottom:4px;">
                      ${this.escapeHtml(st.config.integrantes[rol].especialidad)}
                    </div>
                    ${tareasRol.length === 0 ? `<p style="font-size:12px; color:var(--text-muted);">Sin tareas programadas para esta semana.</p>` : `
                      <div style="display:flex; flex-direction:column; gap:4px;">
                        ${tareasRol.map(t => `
                          <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); padding:5px 8px; border-radius:5px; cursor:pointer;" onclick="App.openTaskModal('${t.id}')">
                            <span style="font-size:12.5px;"><strong>${t.id}:</strong> ${this.escapeHtml(t.titulo)}</span>
                            ${this.renderStatusBadge(t)}
                          </div>
                        `).join("")}
                      </div>
                    `}
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      },

      toggleRutina(k, checked) {
        if (!DataStore.state.rutinas_hoy) DataStore.state.rutinas_hoy = {};
        DataStore.state.rutinas_hoy[k] = checked;
        DataStore.save();
        this.render();
      },
      cambiarParteSemana(p) {
        DataStore.state.config.parte_activa_semana = Number(p);
        DataStore.save();
        this.render();
      },
      cambiarNumeroSemana(s) {
        DataStore.state.config.semana_actual_p1 = Number(s);
        DataStore.save();
        this.render();
      },

      /* 6. VISTA DEPENDENCIAS Y RUTA CRÍTICA */
      renderVistaDependencias() {
        const tareas = DataStore.state.tareas;
        const { criticos, nodes } = Logic.calcularRutaCritica();

        return `
          <div class="card" style="margin-bottom:14px;">
            <div class="card-header">
              <div class="card-title">${Icons.graph} Grafo de Dependencias y Ruta Crítica (CPM)</div>
              <span class="badge tag-VERIFICAR">${criticos.size} Tareas Críticas</span>
            </div>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">
              Una tarea está <strong>bloqueada</strong> si alguna de sus predecesoras no está Hecha. Las tareas con borde dorado forman la <strong>Ruta Crítica</strong> del proyecto (holgura cero).
            </p>

            <div class="grid-3" style="max-height:600px; overflow-y:auto;">
              ${tareas.map(t => {
                const esCrit = criticos.has(t.id);
                const bloq = Logic.isTaskBlocked(t) && t.estado !== "Hecha";
                const deps = t.depende_de || [];
                const succ = tareas.filter(s => (s.depende_de || []).includes(t.id)).map(s => s.id);

                return `
                  <div class="card" style="border-left:5px solid ${esCrit ? '#fbbf24' : (bloq ? 'var(--danger)' : (t.estado === 'Hecha' ? 'var(--accent)' : 'var(--border)'))};" onclick="App.openTaskModal('${t.id}')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span class="task-id">${t.id}</span>
                      ${this.renderStatusBadge(t)}
                    </div>
                    <div style="font-weight:700; margin:6px 0;">${this.escapeHtml(t.titulo)}</div>
                    <div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">
                      ${this.escapeHtml(t.rol_responsable)} • P${t.parte} (S${t.semana_inicio}-S${t.semana_fin})
                    </div>
                    <div style="font-size:11.5px; margin-top:4px;">
                      <strong>Predecesoras:</strong> ${deps.length ? deps.map(d => `<span class="badge ${criticos.has(d) ? 'tag-VERIFICAR' : 'status-Pendiente'}" style="cursor:pointer;" onclick="event.stopPropagation(); App.openTaskModal('${d}')">${d}</span>`).join(" ") : '<span style="color:var(--text-muted);">Ninguna</span>'}
                    </div>
                    <div style="font-size:11.5px; margin-top:4px;">
                      <strong>Sucesoras:</strong> ${succ.length ? succ.map(s => `<span class="badge ${criticos.has(s) ? 'tag-VERIFICAR' : 'status-Pendiente'}" style="cursor:pointer;" onclick="event.stopPropagation(); App.openTaskModal('${s}')">${s}</span>`).join(" ") : '<span style="color:var(--text-muted);">Ninguna</span>'}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      },

      /* 7. MODAL DETALLE DE TAREA */
      openTaskModal(taskId) {
        this.activeModalTaskId = taskId;
        this.activeModalSubtab = "pasos";
        const m = document.getElementById("task-modal");
        const panel = document.getElementById("task-modal-content");
        if (m && panel) {
          panel.innerHTML = this.renderTaskModalContent(taskId);
          m.classList.add("open");
        }
      },

      closeTaskModal() {
        this.activeModalTaskId = null;
        const m = document.getElementById("task-modal");
        if (m) m.classList.remove("open");
        this.render();
      },

      renderTaskModalContent(taskId) {
        const t = DataStore.state.tareas.find(x => x.id === taskId);
        if (!t) return `<div class="modal-body">Tarea no encontrada</div>`;

        const prog = Logic.getTaskProgress(t);
        const bloq = Logic.isTaskBlocked(t) && t.estado !== "Hecha";
        const sub = this.activeModalSubtab;

        return `
          <div class="modal-header">
            <div>
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="task-id" style="font-size:16px;">${t.id}</span>
                <span class="badge tag-PDF">Parte ${t.parte}</span>
                <span class="badge tag-DISENO">${this.escapeHtml(t.fase)}</span>
                ${this.renderBadges(t.etiquetas)}
              </div>
              <h2 id="modal-task-title" style="font-size:18px; margin-top:4px;">${this.escapeHtml(t.titulo)}</h2>
            </div>
            <button class="btn btn-sm" onclick="App.closeTaskModal()" style="font-size:18px; line-height:1; padding:2px 8px;" aria-label="Cerrar modal">&times;</button>
          </div>

          <div class="modal-body">
            <!-- BANNER DE CRITERIO DE ACEPTACIÓN -->
            <div class="acceptance-banner">
              <div>
                <div style="font-size:11px; font-weight:800; text-transform:uppercase; color:var(--accent);">CRITERIO DE ACEPTACIÓN [OBLIGATORIO]</div>
                <div style="font-size:13px; font-weight:600; margin-top:2px;">${this.escapeHtml(t.criterio_aceptacion)}</div>
              </div>
              <label style="display:flex; align-items:center; gap:6px; font-weight:700; white-space:nowrap; cursor:pointer;">
                <input type="checkbox" ${t.criterio_aprobado ? 'checked' : ''} onchange="App.toggleCriterioModal('${t.id}', this.checked)" />
                <span>Aprobado</span>
              </label>
            </div>

            <!-- FILA DE ESTADO Y METADATOS -->
            <div class="grid-4" style="margin-bottom:14px; background:var(--bg-card); padding:10px; border-radius:8px;">
              <div>
                <label style="font-size:11.5px; color:var(--text-muted);">Estado:</label>
                <select onchange="App.cambiarEstadoModal('${t.id}', this.value)">
                  ${["Pendiente", "En curso", "En revisión", "Hecha"].map(est => `
                    <option value="${est}" ${t.estado === est ? 'selected' : ''}>${est}</option>
                  `).join("")}
                </select>
              </div>
              <div>
                <label style="font-size:11.5px; color:var(--text-muted);">Responsable:</label>
                <select onchange="App.actualizarCampoTarea('${t.id}', 'rol_responsable', this.value)">
                  <option value="Todos" ${t.rol_responsable === 'Todos' ? 'selected' : ''}>Todos</option>
                  <option value="Integrante 1" ${t.rol_responsable === 'Integrante 1' ? 'selected' : ''}>${this.escapeHtml(Logic.formatMemberName('Integrante 1'))}</option>
                  <option value="Integrante 2" ${t.rol_responsable === 'Integrante 2' ? 'selected' : ''}>${this.escapeHtml(Logic.formatMemberName('Integrante 2'))}</option>
                  <option value="Integrante 3" ${t.rol_responsable === 'Integrante 3' ? 'selected' : ''}>${this.escapeHtml(Logic.formatMemberName('Integrante 3'))}</option>
                </select>
              </div>
              <div>
                <label style="font-size:11.5px; color:var(--text-muted);">Revisión cruzada:</label>
                <div style="font-size:12px; font-weight:600; padding:6px 0;">${this.escapeHtml(t.revisor)}</div>
              </div>
              <div>
                <label style="font-size:11.5px; color:var(--text-muted);">Avance de pasos:</label>
                <div style="font-size:14px; font-weight:700; color:var(--accent);">${prog}%</div>
                <div class="progress-wrap"><div class="progress-bar" style="width:${prog}%"></div></div>
              </div>
            </div>

            ${bloq ? `
              <div style="background:var(--danger-soft); border:1px solid var(--danger); border-radius:8px; padding:8px 12px; margin-bottom:12px; font-size:12.5px; color:var(--danger); display:flex; align-items:center; gap:6px;">
                ${Icons.lock} <span><strong>Esta tarea está bloqueada</strong> porque depende de: [${Logic.getBlockingIds(t).join(', ')}] que no están Hechas.</span>
              </div>
            ` : ''}

            <!-- PESTAÑAS INTERNAS -->
            <div class="subtabs">
              <button class="btn btn-sm ${sub === 'pasos' ? 'btn-primary' : ''}" onclick="App.cambiarSubtabModal('pasos')">Cómo hacerlo (${t.pasos.length} pasos)</button>
              <button class="btn btn-sm ${sub === 'info' ? 'btn-primary' : ''}" onclick="App.cambiarSubtabModal('info')">Metadatos y Dependencias</button>
              <button class="btn btn-sm ${sub === 'notas' ? 'btn-primary' : ''}" onclick="App.cambiarSubtabModal('notas')">Notas y Enlaces</button>
              <button class="btn btn-sm ${sub === 'historial' ? 'btn-primary' : ''}" onclick="App.cambiarSubtabModal('historial')">Historial (${(t.historial || []).length})</button>
            </div>

            <!-- CONTENIDO DE PESTAÑAS -->
            ${sub === 'pasos' ? `
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                  <span style="font-size:12px; color:var(--text-muted);">Marca cada paso para reflejar el avance real:</span>
                  <button class="btn btn-sm" onclick="App.agregarPasoModal('${t.id}')">+ Añadir paso</button>
                </div>
                ${t.pasos.map((p, idx) => `
                  <div style="display:flex; align-items:flex-start; gap:8px; padding:6px; background:var(--bg-card); border-radius:6px; margin-bottom:6px;">
                    <input type="checkbox" ${p.hecho ? 'checked' : ''} onchange="App.togglePasoModal('${t.id}', '${p.id}', this.checked)" />
                    <div style="flex:1; font-size:13px; ${p.hecho ? 'text-decoration:line-through; color:var(--text-muted);' : ''}">
                      ${this.escapeHtml(p.texto)}
                    </div>
                    <button class="btn btn-sm btn-danger" onclick="App.eliminarPasoModal('${t.id}', '${p.id}')" title="Eliminar paso" style="display:inline-flex; align-items:center; padding:4px;">${Icons.trash}</button>
                  </div>
                `).join("")}
              </div>
            ` : ''}

            ${sub === 'info' ? `
              <div style="display:flex; flex-direction:column; gap:10px;">
                <div>
                  <label style="font-size:12px; font-weight:700;">Descripción detallada:</label>
                  <textarea rows="3" onchange="App.actualizarCampoTarea('${t.id}', 'descripcion', this.value)">${this.escapeHtml(t.descripcion)}</textarea>
                </div>
                <div class="grid-2">

      cambiarSubtabModal(sub) {
        this.activeModalSubtab = sub;
        const panel = document.getElementById("task-modal-content");
        if (panel && this.activeModalTaskId) {
          panel.innerHTML = this.renderTaskModalContent(this.activeModalTaskId);
        }
      },

      toggleCriterioModal(tId, checked) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          t.criterio_aprobado = checked;
          t.historial.unshift({ fecha: new Date().toISOString(), autor: DataStore.state.config.usuario_actual || "Equipo", cambio: `Criterio de aceptación ${checked ? 'APROBADO' : 'desmarcado'}` });
          DataStore.save();
          this.cambiarSubtabModal(this.activeModalSubtab);
        }
      },

      cambiarEstadoModal(tId, nuevoEstado) {
        Logic.changeTaskStatus(tId, nuevoEstado);
        this.cambiarSubtabModal(this.activeModalSubtab);
      },

      togglePasoModal(tId, pId, checked) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          const p = t.pasos.find(x => x.id === pId);
          if (p) p.hecho = checked;
          DataStore.save();
          this.cambiarSubtabModal(this.activeModalSubtab);
        }
      },

      agregarPasoModal(tId) {
        const texto = prompt("Nuevo paso a ejecutar:");
        if (!texto) return;
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          t.pasos.push({ id: `${t.id}-P${t.pasos.length + 1}`, texto, hecho: false });
          DataStore.save();
          this.cambiarSubtabModal(this.activeModalSubtab);
        }
      },

      eliminarPasoModal(tId, pId) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          t.pasos = t.pasos.filter(x => x.id !== pId);
          DataStore.save();
          this.cambiarSubtabModal(this.activeModalSubtab);
        }
      },

      actualizarCampoTarea(tId, campo, valor) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          t[campo] = valor;
          t.actualizada = new Date().toISOString();
          DataStore.save();
        }
      },

      actualizarSemanaTarea(tId, campo, valor) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          t[campo] = Number(valor);
          Logic.recalcularFechas();
          this.cambiarSubtabModal(this.activeModalSubtab);
        }
      },
