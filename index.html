                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="task-id" style="font-size:14px;">${q.id}</span>
                    <select onchange="App.actualizarEstadoPregunta('${q.id}', this.value)" style="width:auto; font-size:11.5px; padding:2px;">
                      <option value="pendiente" ${q.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                      <option value="respondida" ${q.estado === 'respondida' ? 'selected' : ''}>Respondida</option>
                    </select>
                  </div>
                  <div style="font-weight:700; margin:6px 0; font-size:13.5px;">${this.escapeHtml(q.pregunta)}</div>
                  <div style="margin-top:6px;">
                    <label style="font-size:11px; font-weight:700; color:var(--accent);">Respuesta oficial de la docente:</label>
                    <textarea rows="2" placeholder="Escribir respuesta..." onchange="App.actualizarRespuestaPregunta('${q.id}', this.value)">${this.escapeHtml(q.respuesta || '')}</textarea>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      },

      actualizarEstadoPregunta(id, val) {
        const q = DataStore.state.preguntas.find(x => x.id === id);
        if (q) q.estado = val;
        DataStore.save();
      },
      actualizarRespuestaPregunta(id, val) {
        const q = DataStore.state.preguntas.find(x => x.id === id);
        if (q) {
          q.respuesta = val;
          if (val.trim() !== '') {
            q.estado = 'respondida';
            q.fecha = new Date().toISOString().slice(0, 10);
          }
        }
        // Sincronizar en el paso de T1.02
        const t02 = DataStore.state.tareas.find(x => x.id === 'T1.02');
        if (t02 && t02.pasos) {
          t02.pasos.forEach(p => {
            (p.subpasos || []).forEach(sub => {
              if (sub.ref_id === id) {
                sub.respuesta = val;
                if (val.trim() !== '') sub.hecho = true;
              }
            });
            if (p.subpasos && p.subpasos.length > 0) {
              p.hecho = p.subpasos.every(s => s.hecho);
            }
          });
        }
        DataStore.save();
      },

      renderPendientesInmediatos() {
        return `
          <div class="card">
            <div class="card-header"><div class="card-title" style="display:flex; align-items:center; gap:6px;">${Icons.clock} Pendientes Inmediatos (Sección 20)</div></div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${DataStore.state.pendientes_inmediatos.map(p => `
                <label style="display:flex; align-items:center; gap:8px; padding:8px; background:var(--bg-card); border-radius:6px; font-size:13px;">
                  <input type="checkbox" ${p.hecho ? 'checked' : ''} onchange="App.togglePendienteInmediato('${p.id}', this.checked)" />
                  <span style="font-weight:700; color:var(--accent); min-width:24px;">#${p.orden}</span>
                  <span style="${p.hecho ? 'text-decoration:line-through; color:var(--text-muted);' : ''}">${this.escapeHtml(p.texto)}</span>
                </label>
              `).join("")}
            </div>
          </div>
        `;
      },

      togglePendienteInmediato(id, checked) {
        const p = DataStore.state.pendientes_inmediatos.find(x => x.id === id);
        if (p) p.hecho = checked;
        DataStore.save();
        this.render();
      },

      /* VISTA DE CONSULTA DEL DOCUMENTO ÍNTEGRO */
      renderVistaReferencia() {
        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title" style="display:flex; align-items:center; gap:6px;">${Icons.docs} Plan Maestro v2.0 — Texto Íntegro de Referencia</div>
            </div>
            <pre style="background:var(--bg-input); padding:14px; border-radius:8px; font-family:monospace; font-size:12px; white-space:pre-wrap; line-height:1.45; max-height:75vh; overflow-y:auto; border:1px solid var(--border);">${this.escapeHtml(PLAN_MAESTRO_TEXTO_INTEGRO)}</pre>
          </div>
        `;
      },

      /* 11. VISTA CONFIGURACIÓN Y SINCRONIZACIÓN */
      renderVistaConfig() {
        const st = DataStore.state;
        const cfg = st.config;
        const fb = cfg.firebase || {};

        return `
          <div class="grid-2">
            <div class="card">
              <div class="card-header"><div class="card-title" style="display:flex; align-items:center; gap:6px;">${Icons.user} Configuración del Equipo (Grupo 1)</div></div>
              <div style="display:flex; flex-direction:column; gap:10px;">
                <div style="background:var(--bg-card); padding:8px; border-radius:6px; font-size:12px;">
                  <strong>Nombres en Ficha Oficial:</strong> ${cfg.integrantes_ficha}
                  <button class="btn btn-sm btn-primary" style="margin-top:4px;" onclick="App.asignarNombresFicha()">Asignar automáticamente Xavier, Angelo y Fernando</button>
                </div>
                ${["Integrante 1", "Integrante 2", "Integrante 3"].map(rol => `
                  <div>
                    <label style="font-size:12px; font-weight:700;">Nombre para ${rol}:</label>
                    <input type="text" value="${this.escapeHtml(cfg.integrantes[rol].nombre)}" onchange="App.actualizarNombreIntegrante('${rol}', this.value)" />
                    <span style="font-size:11.5px; color:var(--text-muted);">${cfg.integrantes[rol].especialidad}</span>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="card">
              <div class="card-header"><div class="card-title" style="display:flex; align-items:center; gap:6px;">${Icons.cloud} Sincronización Opcional con Firebase Realtime Database</div></div>
              <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">
                Permite a los 3 integrantes sincronizar tareas y bitácora en vivo desde el celular sin necesidad de servidor propio.
              </div>
              <div style="display:flex; flex-direction:column; gap:8px;">
                <label style="display:flex; align-items:center; gap:6px; font-weight:700;">
                  <input type="checkbox" ${fb.activo ? 'checked' : ''} onchange="App.actualizarFirebase('activo', this.checked)" />
                  <span>Habilitar sincronización con Firebase</span>
                </label>
                <div>
                  <label style="font-size:11.5px;">URL de Firebase Realtime Database:</label>
                  <input type="text" placeholder="https://tu-proyecto-default-rtdb.firebaseio.com" value="${this.escapeHtml(fb.databaseURL || '')}" onchange="App.actualizarFirebase('databaseURL', this.value)" />
                </div>
                <div>
                  <label style="font-size:11.5px;">Nombre del nodo compartido:</label>
                  <input type="text" value="${this.escapeHtml(fb.rutaNodo || 'epn_iot_grupo1_camara')}" onchange="App.actualizarFirebase('rutaNodo', this.value)" />
                </div>
                <div>
                  <label style="font-size:11.5px;">Token / Secret Auth (opcional para reglas privadas):</label>
                  <input type="password" placeholder="Clave de base de datos o token" value="${this.escapeHtml(fb.secretToken || '')}" onchange="App.actualizarFirebase('secretToken', this.value)" />
                </div>
                <div style="display:flex; gap:6px; margin-top:6px;">
                  <button class="btn btn-sm btn-primary" onclick="DataStore.pushToFirebase(); alert('Datos enviados a Firebase.')" style="display:inline-flex; align-items:center; gap:6px;">${Icons.upload} Subir a Firebase</button>
                  <button class="btn btn-sm" onclick="DataStore.pullFromFirebase()" style="display:inline-flex; align-items:center; gap:6px;">${Icons.download} Descargar de Firebase</button>
                </div>
              </div>
            </div>
          </div>

          <div class="card" style="margin-top:16px;">
            <div class="card-header"><div class="card-title" style="display:flex; align-items:center; gap:6px;">${Icons.storage} Copia de Seguridad, Exportación y Restablecimiento</div></div>
            <div style="display:flex; flex-wrap:wrap; gap:8px;">
              <button class="btn btn-primary" onclick="App.exportarJSON()" style="display:inline-flex; align-items:center; gap:6px;">${Icons.download} Exportar Todo en JSON</button>
              <label class="btn" style="cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
                ${Icons.upload} Importar JSON <input type="file" accept=".json" style="display:none;" onchange="App.importarJSON(event)" />
              </label>
              <button class="btn" onclick="App.exportarTareasCSV()" style="display:inline-flex; align-items:center; gap:6px;">${Icons.docs} Exportar Tareas a CSV</button>
              <button class="btn btn-danger" onclick="DataStore.reset()" style="display:inline-flex; align-items:center; gap:6px;">${Icons.alert} Restablecer Datos de Fábrica</button>
            </div>
          </div>
        `;
      },

      asignarNombresFicha() {
        DataStore.state.config.integrantes["Integrante 1"].nombre = "Xavier Anatoa";
        DataStore.state.config.integrantes["Integrante 2"].nombre = "Angelo Conterón";
        DataStore.state.config.integrantes["Integrante 3"].nombre = "Fernando Guarderas";
        DataStore.save();
        this.render();
        alert("Nombres oficiales asignados a los 3 roles.");
      },

      actualizarNombreIntegrante(rol, nombre) {
        DataStore.state.config.integrantes[rol].nombre = nombre;
        DataStore.save();
        this.render();
      },

      actualizarFirebase(campo, val) {
        if (!DataStore.state.config.firebase) DataStore.state.config.firebase = {};
        DataStore.state.config.firebase[campo] = val;
        DataStore.save();
      },

      exportarJSON() {
        const json = JSON.stringify(DataStore.state, null, 2);
        this.descargarArchivo(json, `plan_maestro_grupo1_${new Date().toISOString().slice(0, 10)}.json`, "application/json");
      },

      importarJSON(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data && data.tareas && data.decisiones) {
              DataStore.state = data;
              DataStore.save();
              this.render();
              alert("Datos importados con éxito.");
            } else {
              alert("El archivo no parece ser un JSON válido de la aplicación.");
            }
          } catch (err) {
            alert("Error al leer el archivo JSON: " + err.message);
          }
        };
        reader.readAsText(file);
      },

      exportarTareasCSV() {
        let csv = "ID,Parte,Fase,Titulo,Responsable,Revisor,Estado,Progreso,SemanaInicio,SemanaFin,FechaInicio,FechaFin,CriterioAprobado\n";
        DataStore.state.tareas.forEach(t => {
          csv += `"${t.id}","${t.parte}","${t.fase}","${t.titulo.replace(/"/g, '""')}","${t.rol_responsable}","${t.revisor}","${t.estado}","${Logic.getTaskProgress(t)}%","${t.semana_inicio}","${t.semana_fin}","${t.fecha_inicio}","${t.fecha_fin}","${t.criterio_aprobado ? 'SI' : 'NO'}"\n`;
        });
        this.descargarArchivo(csv, "tareas_camara_iot.csv", "text/csv");
      },

      descargarArchivo(contenido, nombre, tipo) {
        const blob = new Blob([contenido], { type: tipo });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = nombre;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    };

    // Inicializar aplicación al cargar
    document.addEventListener("DOMContentLoaded", () => App.init());

    // Registro de Service Worker para PWA (solo cuando se sirve por http/https)
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('PWA ServiceWorker activo:', reg.scope);
            // Comprobar automáticamente si Angelo subió una nueva versión a GitHub
            reg.update();
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('Nueva versión de la app lista.');
                  }
                };
              }
            };
          })
          .catch(err => console.log('PWA ServiceWorker error:', err));
      });
    }
  </script>
</body>
</html>
