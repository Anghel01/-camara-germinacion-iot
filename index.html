        return `
          <div class="grid-2">
            <div class="card">
              <div class="card-header">
                <div class="card-title">${Icons.leaf} Sensor Capacitivo de Sustrato v1.2 (#1 y #2)</div>
                <span class="badge tag-PDF">Fórmula map() C++</span>
              </div>
              <div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">
                Mapeo: <code>map(adc, ADC_aire, ADC_agua, 0, 100)</code> limitado a 0–100%.
              </div>

              <div style="background:var(--bg-card); padding:10px; border-radius:8px; margin-bottom:10px;">
                <strong>Sensor #1 (Principal)</strong>
                <div class="grid-3" style="margin-top:6px;">
                  <div><label style="font-size:11px;">Aire Seco (0%):</label><input type="number" value="${cal.cap1_aire}" onchange="App.actualizarCalib('cap1_aire', this.value)" /></div>
                  <div><label style="font-size:11px;">Agua Línea (100%):</label><input type="number" value="${cal.cap1_agua}" onchange="App.actualizarCalib('cap1_agua', this.value)" /></div>
                  <div><label style="font-size:11px;">ADC Prueba:</label><input type="number" value="${cal.cap1_adc_prueba}" oninput="App.actualizarCalib('cap1_adc_prueba', this.value)" /></div>
                </div>
                <div style="margin-top:8px; font-weight:700; color:var(--accent);">
                  Porcentaje Calculado: ${pCap1}%
                </div>
              </div>

              <div style="background:var(--bg-card); padding:10px; border-radius:8px;">
                <strong>Sensor #2 (Respaldo)</strong>
                <div class="grid-3" style="margin-top:6px;">
                  <div><label style="font-size:11px;">Aire Seco (0%):</label><input type="number" value="${cal.cap2_aire}" onchange="App.actualizarCalib('cap2_aire', this.value)" /></div>
                  <div><label style="font-size:11px;">Agua Línea (100%):</label><input type="number" value="${cal.cap2_agua}" onchange="App.actualizarCalib('cap2_agua', this.value)" /></div>
                  <div><label style="font-size:11px;">ADC Prueba:</label><input type="number" value="${cal.cap2_adc_prueba}" oninput="App.actualizarCalib('cap2_adc_prueba', this.value)" /></div>
                </div>
                <div style="margin-top:8px; font-weight:700; color:var(--accent);">
                  Porcentaje Calculado: ${pCap2}%
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <div class="card-title">Nivel de Agua y Sensor MQ-135</div>
              </div>
              <div style="background:var(--bg-card); padding:10px; border-radius:8px; margin-bottom:10px;">
                <strong>Sensor de Nivel de Agua</strong>
                <div class="grid-3" style="margin-top:6px;">
                  <div><label style="font-size:11px;">Depósito Vacío:</label><input type="number" value="${cal.nivel_vacio}" onchange="App.actualizarCalib('nivel_vacio', this.value)" /></div>
                  <div><label style="font-size:11px;">Depósito Lleno:</label><input type="number" value="${cal.nivel_lleno}" onchange="App.actualizarCalib('nivel_lleno', this.value)" /></div>
                  <div><label style="font-size:11px;">Umbral Alerta:</label><input type="number" value="${cal.nivel_umbral}" onchange="App.actualizarCalib('nivel_umbral', this.value)" /></div>
                </div>
              </div>

              <div style="background:var(--bg-card); padding:10px; border-radius:8px;">
                <strong>MQ-135 (Divisor 10 kΩ / 15 kΩ)</strong>
                <div class="grid-2" style="margin-top:6px;">
                  <div><label style="font-size:11px;">Aire limpio precalentado (R0):</label><input type="number" value="${cal.mq135_r0_adc}" onchange="App.actualizarCalib('mq135_r0_adc', this.value)" /></div>
                  <div><label style="font-size:11px;">Con semillas germinando (Rs):</label><input type="number" value="${cal.mq135_rs_adc}" onchange="App.actualizarCalib('mq135_rs_adc', this.value)" /></div>
                </div>
                <div style="margin-top:8px; font-weight:700; color:var(--purple);">
                  Índice Relativo Rs/R0 = ${ratioMQ}

              </div>
            </div>
          </div>
        `;

      actualizarCalib(campo, val) {
        DataStore.state.calibracion[campo] = Number(val);

      renderPlantillaPiloto() {
        const st = DataStore.state;
        const cfg = st.config.piloto_config;
        const visitas = st.piloto_visitas || [];

        // Generar puntos SVG para curva de % germinación
        const w = 600, h = 180, pad = 30;
        let points = "";
        if (visitas.length > 1) {
          points = visitas.map((v, i) => {
            const x = pad + (i / (visitas.length - 1)) * (w - 2 * pad);
            const y = h - pad - (v.porcentaje_germ / 100) * (h - 2 * pad);
            return `${x},${y}`;
          }).join(" ");
        }

        return `
          <div class="card" style="margin-bottom:14px;">
            <div class="card-header">
              <div class="card-title">Curva de % Germinación en Tiempo Real</div>
              <button class="btn btn-sm btn-primary" onclick="App.agregarVisitaPilotoPrompt()">+ Registrar Visita</button>
            </div>
            <div style="width:100%; overflow-x:auto;">
              <svg viewBox="0 0 ${w} ${h}" style="width:100%; max-height:220px; background:var(--bg-input); border-radius:8px;">
                <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="var(--border)" stroke-width="2" />
                <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h - pad}" stroke="var(--border)" stroke-width="2" />
                <!-- Línea umbral 80% -->
                <line x1="${pad}" y1="${h - pad - 0.8 * (h - 2 * pad)}" x2="${w - pad}" y2="${h - pad - 0.8 * (h - 2 * pad)}" stroke="var(--accent)" stroke-dasharray="4" />
                <text x="${w - pad - 60}" y="${h - pad - 0.8 * (h - 2 * pad) - 4}" fill="var(--accent)" font-size="10">Meta 80%</text>
                ${points ? `<polyline points="${points}" fill="none" stroke="var(--info)" stroke-width="3" />` : ''}
                ${visitas.map((v, i) => {
                  const x = pad + (i / Math.max(1, visitas.length - 1)) * (w - 2 * pad);
                  const y = h - pad - (v.porcentaje_germ / 100) * (h - 2 * pad);
                  return `
                    <circle cx="${x}" cy="${y}" r="4" fill="var(--accent)" />
                    <text x="${x - 10}" y="${y - 8}" fill="var(--text-main)" font-size="10">${v.porcentaje_germ}%</text>
                  `;
                }).join("")}
              </svg>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">Cuadrícula de Visitas del Lote Piloto (N = ${cfg.n_semillas} semillas)</div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Fecha / Hora</th>
                    <th>Temp (°C)</th>
                    <th>Hum Aire (%)</th>
                    <th>Hum Sust (%)</th>
                    <th>GDDh</th>
                    <th>Radículas (n)</th>
                    <th>% Germinación</th>
                    <th>Agua</th>
                    <th>Foto</th>
                    <th>Observaciones</th>
                  </tr>
                </thead>
                <tbody>
                  ${visitas.map(v => `
                    <tr>
                      <td style="font-size:11.5px;">${v.fecha_hora.replace('T', ' ')}</td>
                      <td>${v.temp_c}°</td>
                      <td>${v.hum_aire}%</td>
                      <td>${v.hum_sustrato}%</td>
                      <td>${v.gddh_acum}</td>
                      <td><strong>${v.radiculas_n}</strong> / ${cfg.n_semillas}</td>
                      <td><span class="badge ${v.porcentaje_germ >= 80 ? 'status-Hecha' : 'status-En-curso'}">${v.porcentaje_germ}%</span></td>
                      <td>${v.agua_estado}</td>
                      <td style="font-family:monospace; font-size:11px;">${this.escapeHtml(v.archivo_foto)}</td>
                      <td style="font-size:12px;">${this.escapeHtml(v.observaciones)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },

      agregarVisitaPilotoPrompt() {
        const N = DataStore.state.config.piloto_config.n_semillas || 25;
        const nStr = prompt(`Semillas con radícula emergida (>= 2 mm) sobre N = ${N}:`, "0");
        if (nStr === null) return;
        const n = Math.min(N, Math.max(0, Number(nStr) || 0));
        const pct = Math.round((n / N) * 100);
        const temp = Number(prompt("Temperatura actual (°C):", "20.5") || 20);
        const humA = Number(prompt("Humedad relativa del aire (%):", "85") || 85);
        const humS = Number(prompt("Humedad de sustrato (%):", "76") || 76);
        const obs = prompt("Observaciones (condensación, hongos, etc.):", "Normal");

        const id = `VIS-${String(DataStore.state.piloto_visitas.length + 1).padStart(2, '0')}`;
        DataStore.state.piloto_visitas.push({
          id,
          dia: DataStore.state.piloto_visitas.length + 1,
          hora_bloque: "12:00",
          fecha_hora: new Date().toISOString().slice(0, 16),
          temp_c: temp,
          hum_aire: humA,
          hum_sustrato: humS,
          gddh_acum: Math.round(temp * 12),
          radiculas_n: n,
          porcentaje_germ: pct,
          agua_estado: "Sí",
          archivo_foto: `piloto_${id}.jpg`,
          observaciones: obs || ""
        });
        DataStore.save();
        this.render();
      },

      exportarJSON() {
        const json = JSON.stringify(DataStore.state, null, 2);
        this.descargarArchivo(json, `plan_maestro_grupo1_${new Date().toISOString().slice(0, 10)}.json`, "application/json");
      },

      importarJSON(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data && data.tareas && data.decisiones) {
              DataStore.state = data;
              DataStore.save();
              this.render();
              alert("Datos importados con éxito.");
            } else {
              alert("El archivo no parece ser un JSON válido de la aplicación.");
            }
          } catch (err) {
            alert("Error al leer el archivo JSON: " + err.message);
          }
        };
        reader.readAsText(file);
      },

      exportarTareasCSV() {
        let csv = "ID,Parte,Fase,Titulo,Responsable,Revisor,Estado,Progreso,SemanaInicio,SemanaFin,FechaInicio,FechaFin,CriterioAprobado\n";
        DataStore.state.tareas.forEach(t => {
          csv += `"${t.id}","${t.parte}","${t.fase}","${t.titulo.replace(/"/g, '""')}","${t.rol_responsable}","${t.revisor}","${t.estado}","${Logic.getTaskProgress(t)}%","${t.semana_inicio}","${t.semana_fin}","${t.fecha_inicio}","${t.fecha_fin}","${t.criterio_aprobado ? 'SI' : 'NO'}"\n`;
        });
        this.descargarArchivo(csv, "tareas_camara_iot.csv", "text/csv");
      },

      descargarArchivo(contenido, nombre, tipo) {
        const blob = new Blob([contenido], { type: tipo });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = nombre;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    };

    // Inicializar aplicación al cargar
    document.addEventListener("DOMContentLoaded", () => App.init());

    // Registro de Service Worker para PWA (solo cuando se sirve por http/https)
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('PWA ServiceWorker activo:', reg.scope);
            // Comprobar automáticamente si Angelo subió una nueva versión a GitHub
            reg.update();
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('Nueva versión de la app lista.');
                  }
                };
              }
            };
          })
          .catch(err => console.log('PWA ServiceWorker error:', err));
      });
    }
  </script>
</body>
</html>
