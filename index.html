<!DOCTYPE html>
<html lang="es" data-theme="oscuro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Cámara de Germinación Inteligente — Plan Maestro v2.0 (Grupo 1 EPN)</title>
  <meta name="theme-color" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 20A7 7 0 0 1 4 13a7 7 0 0 1 7-7c4 0 9 3 9 7a7 7 0 0 1-7 7z'/%3E%3Cpath d='M11 20V10'/%3E%3Cpath d='M11 14h4'/%3E%3C/svg%3E" />
  <style>
    :root[data-theme="oscuro"] {
      --bg-main: #0b111e;
      --bg-panel: #131c2e;
      --bg-card: #1a263d;
      --bg-hover: #243452;
      --bg-input: #0e1726;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #2a3b5c;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-soft: rgba(16, 185, 129, 0.15);
      --info: #3b82f6;
      --info-soft: rgba(59, 130, 246, 0.16);
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.16);
      --purple: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.16);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    :root[data-theme="claro"] {
      --bg-main: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-card: #f8fafc;
      --bg-hover: #e2e8f0;
      --bg-input: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --accent: #059669;
      --accent-hover: #047857;
      --accent-soft: rgba(5, 150, 105, 0.12);
      --info: #2563eb;
      --info-soft: rgba(37, 99, 235, 0.12);
      --warn: #d97706;
      --warn-soft: rgba(217, 119, 6, 0.14);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.12);
      --purple: #7e22ce;
      --purple-soft: rgba(126, 34, 206, 0.12);
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }

    /* TOPBAR */
    .topbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 9px;
      background: var(--accent-soft); border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; flex-shrink: 0;
    }
    .brand-title { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
    .brand-sub { font-size: 11.5px; color: var(--text-muted); }
    .topbar-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* NAV TABS */
    .nav-tabs {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      gap: 4px;
      padding: 6px 12px;
      scrollbar-width: thin;
    }
    .nav-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    .nav-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

    /* MAIN CONTAINER */
    .main-container {
      flex: 1;
      padding: 16px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    /* GRID & CARDS */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .card-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    /* BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .tag-PDF { background: var(--info-soft); color: var(--info); border: 1px solid var(--info); }
    .tag-DISENO { background: var(--purple-soft); color: var(--purple); border: 1px solid var(--purple); }
    .tag-VERIFICAR { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
    .tag-OPCIONAL { background: rgba(148, 163, 184, 0.18); color: var(--text-muted); border: 1px solid var(--border); }

    .status-Pendiente { background: rgba(148, 163, 184, 0.16); color: var(--text-muted); border: 1px solid var(--border); }
    .status-En-curso { background: var(--info-soft); color: var(--info); border: 1px solid var(--info); }
    .status-En-revision { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
    .status-Hecha { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
    .status-Bloqueada { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); }

    /* PROGRESS */
    .progress-wrap {
      width: 100%;
      background: var(--bg-input);
      height: 9px;
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #34d399);
      transition: width 0.25s ease;
    }

    /* FORMS & BUTTONS */
    input, select, textarea {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn-primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
    .btn-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
    .btn-sm { padding: 4px 8px; font-size: 11.5px; }

    /* TASK ITEM */
    .task-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
    }
    .task-item:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .task-item.blocked { border-left: 4px solid var(--danger); }
    .task-item.done { border-left: 4px solid var(--accent); }
    .task-id { font-family: monospace; font-weight: 700; font-size: 12.5px; color: var(--accent); }

    /* KANBAN */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(270px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .kanban-col {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      min-height: 480px;
    }
    .kanban-col-header {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kanban-dropzone { padding: 10px; flex: 1; }
    .kanban-dropzone.drag-over {
      background: var(--accent-soft);
      border: 2px dashed var(--accent);
      border-radius: 8px;
    }

    /* HORIZONTAL CHECKOUT PIPELINE TREE (DE IZQUIERDA A DERECHA) */
    .checkout-tree-container {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      scrollbar-width: thin;
    }
    .checkout-root-node {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.15);
      flex-shrink: 0;
    }
    .checkout-branch {
      position: relative;
      padding-left: 24px;
      margin-bottom: 28px;
      border-left: 3px solid var(--info);
    }
    .checkout-branch.parte-2 {
      border-left-color: var(--purple);
    }
    .checkout-branch-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .checkout-branch-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkout-phases-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: thin;
      align-items: flex-start;
    }
    .checkout-phase-col {
      min-width: 290px;
      max-width: 320px;
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .checkout-phase-header {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .checkout-tasks-flow {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* PASTEL CARDS */
    .pastel-card {
      border-radius: 9px;
      padding: 11px 13px;
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1.5px solid transparent;
      user-select: none;
    }
    .pastel-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    }

    /* Pastel Libre / Sin Asignar (flotando en la bolsa) */
    .pastel-libre, .pastel-pendiente {
      background: rgba(148, 163, 184, 0.08) !important;
      border: 1.5px dashed rgba(148, 163, 184, 0.45) !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-libre, :root[data-theme="claro"] .pastel-pendiente {
      background: #f8fafc !important;
      border: 1.5px dashed #94a3b8 !important;
      color: #334155 !important;
    }

    /* Pastel Angelo Conterón (Azul Celeste / Cian Pastel) */
    .pastel-user-angelo {
      background: rgba(14, 165, 233, 0.16) !important;
      border: 1.5px solid #0284c7 !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-user-angelo {
      background: #e0f2fe !important;
      border: 1.5px solid #38bdf8 !important;
      color: #0369a1 !important;
    }

    /* Pastel Xavier Anatoa (Ámbar / Naranja Melocotón Cálido Pastel) */
    .pastel-user-xavier {
      background: rgba(245, 158, 11, 0.16) !important;
      border: 1.5px solid #d97706 !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-user-xavier {
      background: #fef3c7 !important;
      border: 1.5px solid #fbbf24 !important;
      color: #92400e !important;
    }

    /* Pastel Fernando Guarderas (Lavanda / Púrpura Pastel) */
    .pastel-user-fernando {
      background: rgba(168, 85, 247, 0.16) !important;
      border: 1.5px solid #9333ea !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-user-fernando {
      background: #f3e8ff !important;
      border: 1.5px solid #c084fc !important;
      color: #6b21a8 !important;
    }

    /* Pastel En curso genérico */
    .pastel-en-curso {
      background: rgba(59, 130, 246, 0.14) !important;
      border: 1.5px solid #3b82f6 !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-en-curso {
      background: #eff6ff !important;
      border: 1.5px solid #93c5fd !important;
      color: #1e3a8a !important;
    }

    /* Pastel En Revisión (Rosa / Coral Pastel) */
    .pastel-en-revision {
      background: rgba(244, 63, 94, 0.16) !important;
      border: 1.5px solid #e11d48 !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-en-revision {
      background: #ffe4e6 !important;
      border: 1.5px solid #fb7185 !important;
      color: #9f1239 !important;
    }

    /* Pastel Finalizada / Realizada (Verde Menta Pastel Completo) */
    .pastel-hecha {
      background: rgba(16, 185, 129, 0.18) !important;
      border: 1.5px solid #10b981 !important;
      color: var(--text-main) !important;
    }
    :root[data-theme="claro"] .pastel-hecha {
      background: #d1fae5 !important;
      border: 1.5px solid #34d399 !important;
      color: #065f46 !important;
    }

    .pastel-blocked {
      border-left: 4px solid var(--danger) !important;
    }

    /* TABLES & WRAPPERS */
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: var(--bg-card);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 920px;
      width: 100%;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .modal-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
    .acceptance-banner {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .subtabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    /* PRINT */
    @media print {
      .topbar, .nav-tabs, .no-print { display: none !important; }
      body { background: #ffffff; color: #000000; }
      .card { box-shadow: none; border: 1px solid #999; break-inside: avoid; }
    }

    @media (max-width: 768px) {
      .main-container { padding: 10px; }
      .modal-panel { max-height: 96vh; }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR ADAPTADA (DESKTOP & MOBILE) -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" title="Cámara de Germinación Inteligente IoT">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);"><path d="M11 20A7 7 0 0 1 4 13a7 7 0 0 1 7-7c4 0 9 3 9 7a7 7 0 0 1-7 7z"/><path d="M11 20V10"/><path d="M11 14h4"/></svg>
      </div>
      <div>
        <div class="brand-title">Cámara de Germinación IoT — Grupo 1 (EPN)</div>
        <div class="brand-sub" id="topbar-subtitle">Sistemas IoT 2026-B • PhD. Soraya Sinche</div>

        <span>Local</span>
      </span>
      <button class="btn btn-sm" onclick="App.toggleTheme()" style="gap:4px;" title="Cambiar modo claro/oscuro">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <span>Tema</span>
      </button>
    </div>
  </header>

  <!-- PESTAÑAS DE MÓDULOS -->
  <nav class="nav-tabs" aria-label="Módulos del sistema">
    <button class="nav-btn active" data-tab="arbol" onclick="App.switchTab('arbol')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
      <span>Árbol de Ramas</span>

Objetivo general (2.1 del PDF): Desarrollar una cámara de germinación automatizada de bajo costo que mantenga las condiciones óptimas de humedad del sustrato y humedad relativa para acelerar la etapa de imbibición en semillas de fréjol.
Objetivo específico (2.2 del PDF): Implementar una interfaz de control visual e histórica para evaluar el porcentaje de germinación de semillas sin alterar el microclima interno.

TABLA OFICIAL DE PINES ESP32 DEVKIT V1 (Sección 6.4):
- Regla crítica: con el Wi-Fi activo, el ADC2 deja de funcionar. Todo sensor analógico va en pines del ADC1 (GPIO 32, 33, 34, 35, 36, 39).
- Sensor capacitivo de sustrato v1.2: AOUT -> GPIO 34 (ADC1), VCC -> 3V3 del ESP32, GND -> GND.
- DHT22: DATA -> GPIO 4, VCC -> 3V3 del ESP32, GND -> GND (ubicar en parte alta, lejos del chorro de niebla).
- MQ-135: A0 -> GPIO 35 (ADC1) a través de divisor 10 kΩ (desde A0 al GPIO) y 15 kΩ (desde GPIO a GND). VCC -> 5 V fuente externa, GND -> GND común.
- Pantalla OLED 0,96" I2C (0x3C): SDA -> GPIO 21, SCL -> GPIO 22, VCC -> 3V3, GND -> GND.
- Módulo relé 2 canales (sin jumper JD-VCC): IN1 (humidificador) -> GPIO 26, IN2 (tira LED) -> GPIO 27, JD-VCC (bobinas) -> 5 V fuente externa, VCC (lógica) -> 3V3 del ESP32, GND -> GND común. Activo en bajo (escribir HIGH antes de pinMode OUTPUT).
- Sensor de nivel de agua: SIGNAL -> GPIO 32 (ADC1), VCC -> GPIO 33 (salida digital activada solo ~150 ms al medir), GND -> GND.
- Pulsador del humidificador [OPCIONAL]: Base transistor 2N2222 u optoacoplador PC817 -> GPIO 25.

PROTOCOLO MQTT (Sección 7.3) - Broker Mosquitto puerto 1883 con usuario y contraseña:

- Tópico 2 Comandos (Raspberry -> ESP32, QoS 1): epn/iot/grupo1/comandos -> {"cmd": "preparar_foto"} / {"cmd": "fin_foto"}
- Tópico 3 Estado (ESP32 -> Raspberry y ESP32-CAM, QoS 1): epn/iot/grupo1/estado -> {"estado": "foto_listo"}

MODO FOTO (Sección 7.4): 00:00, 06:00, 12:00 y 18:00 (4 fotos/día).
1. Raspberry publica {"cmd": "preparar_foto"}.
2. ESP32 apaga humidificador, enciende tira LED (guardando estado previo) e inicia temporizador de seguridad de 6 minutos.
3. Tras 3-4 min de asentamiento de niebla [A VERIFICAR], ESP32 publica {"estado": "foto_listo"}.
4. ESP32-CAM toma 2-3 fotos, conserva la última y la envía por HTTP POST a /upload.
5. Raspberry responde 200, analiza con OpenCV y publica {"cmd": "fin_foto"}.
6. ESP32 restaura estado previo de tira LED y retoma control del humidificador.`;

    const STORAGE_KEY = "epn_iot_grupo1_camara_v2";

    const DataStore = {
      state: null,
      syncTimer: null,

      init() {
        const raw = localStorage.getItem(STORAGE_KEY);
        const initialData = crearDatosIniciales();
        if (raw) {
          try {
            this.state = JSON.parse(raw);
            if (this.state && Array.isArray(this.state.tareas)) {
              this.state.tareas.forEach(t => {
                if (t.estado === "Pendiente" && t.rol_responsable && t.rol_responsable.startsWith("Integrante")) {
                  t.rol_sugerido_pdf = t.rol_responsable;
                  t.rol_responsable = "Sin asignar";
                }
                // Enriquecer tareas existentes con los pasos completos, desplegables y sub-tareas
                const initT = initialData.tareas.find(x => x.id === t.id);
                if (initT && initT.pasos) {
                  const needsEnrichment = !t.pasos || t.pasos.some(p => !p.detalle && (!p.subpasos || p.subpasos.length === 0));
                  if (needsEnrichment) {
                    const doneMap = {};
                    (t.pasos || []).forEach(p => { doneMap[p.id] = p.hecho; });
                    t.pasos = initT.pasos.map(p => {
                      const wasDone = doneMap[p.id] !== undefined ? doneMap[p.id] : (t.estado === "Hecha");
                      return {
                        ...p,
                        hecho: wasDone,
                        subpasos: (p.subpasos || []).map(s => ({
                          ...s,
                          hecho: wasDone ? true : (s.hecho || false)
                        }))
                      };
                    });
                  }
                }
              });

              // Sincronizar respuestas ya existentes en preguntas oficiales con el paso T1.02
              if (this.state.preguntas) {
                const t02 = this.state.tareas.find(x => x.id === "T1.02");
                if (t02 && t02.pasos) {
                  t02.pasos.forEach(p => {
                    (p.subpasos || []).forEach(sub => {
                      if (sub.ref_id) {
                        const q = this.state.preguntas.find(x => x.id === sub.ref_id);
                        if (q && q.respuesta && !sub.respuesta) {
                          sub.respuesta = q.respuesta;
                          sub.hecho = true;
                        }
                      }
                    });
                  });
                }
              }
            }
          } catch (e) {
            this.state = initialData;
          }
        } else {
          this.state = initialData;
          this.save();
        }
        if (!this.state.config.fecha_entrega_p1) this.state.config.fecha_entrega_p1 = "2026-11-23";
        if (!this.state.config.fecha_entrega_p2) this.state.config.fecha_entrega_p2 = "2027-01-25";
        this.updateSyncBadge();
      },

      save() {
        this.state.ultima_actualizacion = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
        this.updateSyncBadge();
        if (this.state.config.firebase && this.state.config.firebase.activo) {
          clearTimeout(this.syncTimer);
          this.syncTimer = setTimeout(() => this.pushToFirebase(), 800);
        }
      },

      reset() {
        if (confirm("¿Estás seguro de restablecer todos los datos al Plan Maestro v2.0 inicial? Se sobrescribirá el estado actual.")) {
          this.state = crearDatosIniciales();
          this.save();
          App.render();
          alert("Datos restablecidos con éxito.");
        }
      },

      updateSyncBadge() {
        const el = document.getElementById("sync-indicator");
        if (!el) return;
        const fb = this.state?.config?.firebase;
        if (fb && fb.activo && fb.databaseURL) {
          el.className = "badge status-Hecha";
          el.innerHTML = `${Icons.cloud || ''} <span>Firebase Activo</span>`;
        } else {
          el.className = "badge status-Pendiente";
          el.innerHTML = `${Icons.storage || ''} <span>LocalStorage</span>`;
        }
      },

      async pushToFirebase() {
        const fb = this.state.config.firebase;
        if (!fb || !fb.activo || !fb.databaseURL) return;
        try {
          const clean = fb.databaseURL.replace(/\/$/, "");
          const auth = fb.secretToken ? `?auth=${encodeURIComponent(fb.secretToken)}` : "";
          const url = `${clean}/${fb.rutaNodo || "epn_iot_grupo1_camara"}.json${auth}`;
          const safeCopy = JSON.parse(JSON.stringify(this.state));
          // Evitar subir token local dentro del nodo público
          safeCopy.config.firebase = { activo: true, databaseURL: fb.databaseURL, rutaNodo: fb.rutaNodo };
          await fetch(url, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(safeCopy) });
        } catch (e) {
          console.warn("Fallo sync Firebase:", e);
        }
      },

      async pullFromFirebase() {
        const fb = this.state.config.firebase;
        if (!fb || !fb.databaseURL) {
          alert("Ingresa primero la URL de Firebase en Configuración.");
          return;
        }
        try {
          const clean = fb.databaseURL.replace(/\/$/, "");
          const auth = fb.secretToken ? `?auth=${encodeURIComponent(fb.secretToken)}` : "";
          const url = `${clean}/${fb.rutaNodo || "epn_iot_grupo1_camara"}.json${auth}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (data && data.tareas) {
            const fbLocal = { ...this.state.config.firebase };
            this.state = data;
            this.state.config.firebase = fbLocal;
            this.save();
            App.render();
            alert("Datos descargados correctamente de Firebase.");
          } else {
            alert("El nodo en Firebase está vacío. Usa 'Subir a Firebase' primero.");
          }
        } catch (e) {
          alert("Error descargando de Firebase: " + e.message);
        }
      }
    };

    /* ============================================================================
       LÓGICA DEL PROYECTO
       ============================================================================ */
    const Logic = {
      getDaysRemaining(fechaStr) {
        if (!fechaStr) return 0;
        const target = new Date(fechaStr + "T23:59:59");
        const diff = Math.ceil((target - new Date()) / (1000 * 60 * 60 * 24));
        return Math.max(0, diff);
      },

      getTaskProgress(t) {
        if (!t.pasos || t.pasos.length === 0) return t.estado === "Hecha" ? 100 : 0;
        const hechos = t.pasos.filter(p => p.hecho).length;
        return Math.round((hechos / t.pasos.length) * 100);
      },

      isTaskBlocked(t) {
        if (!t.depende_de || t.depende_de.length === 0) return false;
        return t.depende_de.some(depId => {
          const dep = DataStore.state.tareas.find(x => x.id === depId);
          return dep && dep.estado !== "Hecha";
        });
      },

      getBlockingIds(t) {
        if (!t.depende_de) return [];
        return t.depende_de.filter(depId => {
          const dep = DataStore.state.tareas.find(x => x.id === depId);
          return dep && dep.estado !== "Hecha";
        });
      },

      isTaskOverdue(t) {
        if (t.estado === "Hecha") return false;
        const hoy = new Date().toISOString().slice(0, 10);
        return t.fecha_fin && t.fecha_fin < hoy;
      },

      getWeightedProgress(lista) {
        if (!lista || lista.length === 0) return 0;
        let totalP = 0, sumP = 0;
        lista.forEach(t => {
          const peso = Math.max(1, (t.pasos ? t.pasos.length : 1));
          totalP += peso;
          sumP += this.getTaskProgress(t) * peso;
        });
        return totalP === 0 ? 0 : Math.round(sumP / totalP);
      },

      formatMemberName(rol) {
        if (!rol || rol === "Sin asignar" || rol === "Libre") {
          return "Sin asignar (Disponible)";
        }
        const m = DataStore.state.config.integrantes;
        if (m && m[rol] && m[rol].nombre && m[rol].nombre !== rol) {
          return m[rol].nombre;
        }
        return rol;
      },

      getTaskPastelClass(t) {
        if (t.estado === "Hecha") return "pastel-hecha";
        if (t.estado === "En revisión") return "pastel-en-revision";
        if (!t.rol_responsable || t.rol_responsable === "Sin asignar" || t.rol_responsable === "Libre") {
          return "pastel-libre";
        }
        const r = (t.rol_responsable || "").toLowerCase();
        if (r.includes("angelo") || r.includes("integrante 2")) return "pastel-user-angelo";
        if (r.includes("xavier") || r.includes("integrante 1")) return "pastel-user-xavier";
        if (r.includes("fernando") || r.includes("integrante 3")) return "pastel-user-fernando";
        return "pastel-en-curso";
      },

      taskBelongsToUser(t, u) {
        if (!u || u === "Todos" || u === "todos") return true;
        if (u === "Libres" || u === "libres") return !t.rol_responsable || t.rol_responsable === "Sin asignar" || t.rol_responsable === "Libre";
        if (t.rol_responsable === "Todos") return true;
        const m = DataStore.state.config.integrantes;
        for (const [rolKey, val] of Object.entries(m || {})) {
          if ((u === rolKey || u === val.nombre) && (t.rol_responsable.includes(rolKey) || t.rol_responsable.includes(val.nombre))) {
            return true;
          }
        }
        return t.rol_responsable.includes(u);
      },

      changeTaskStatus(taskId, nuevoEstado) {
        const t = DataStore.state.tareas.find(x => x.id === taskId);
        if (!t || t.estado === nuevoEstado) return false;

        // Alerta de bloqueo
        if (nuevoEstado !== "Pendiente" && this.isTaskBlocked(t)) {
          const f = this.getBlockingIds(t).join(", ");
          const ok = confirm(`[TAREA BLOQUEADA] ${t.id} depende de [${f}] no terminadas.\n\n¿Deseas avanzar el estado a "${nuevoEstado}" con confirmación?`);
          if (!ok) return false;
        }

        // Criterio de aceptación
        if (nuevoEstado === "Hecha" && !t.criterio_aprobado) {
          const ok = confirm(`[CRITERIO PENDIENTE]\n"${t.criterio_aceptacion}"\n\n¿Deseas aprobar el criterio y marcar la tarea como Hecha?`);
          if (!ok) return false;
          t.criterio_aprobado = true;
        }

        const ant = t.estado;
        t.estado = nuevoEstado;
        t.actualizada = new Date().toISOString();
        const aut = DataStore.state.config.usuario_actual || "Equipo";
        t.historial.unshift({ fecha: t.actualizada, autor: aut, cambio: `Estado: "${ant}" -> "${nuevoEstado}"` });
        DataStore.save();
        return true;
      },

      recalcularFechas() {
        const p1 = DataStore.state.config.fecha_inicio_p1 || "2026-10-19";
        const p2 = DataStore.state.config.fecha_inicio_p2 || "2026-11-30";
        const sumar = (f, d) => {
          const dt = new Date(f + "T00:00:00");
          dt.setDate(dt.getDate() + d);
          return dt.toISOString().slice(0, 10);
        };
        DataStore.state.tareas.forEach(t => {
          const base = t.parte === 1 ? p1 : p2;
          t.fecha_inicio = sumar(base, (t.semana_inicio - 1) * 7);
          t.fecha_fin = sumar(base, t.semana_fin * 7 - 1);
        });
        DataStore.save();
      },

      calcularRutaCritica() {
        const tareas = DataStore.state.tareas;
        const nodes = {};
        tareas.forEach(t => {
          const dur = Math.max(1, (t.semana_fin - t.semana_inicio + 1));
          nodes[t.id] = { id: t.id, dur, es: 0, ef: dur, ls: Infinity, lf: Infinity, deps: t.depende_de || [] };
        });

        let changed = true, g = 0;
        while (changed && g++ < 100) {
          changed = false;
          tareas.forEach(t => {
            const n = nodes[t.id];
            let maxEf = 0;
            n.deps.forEach(d => { if (nodes[d] && nodes[d].ef > maxEf) maxEf = nodes[d].ef; });
            const es = maxEf, ef = es + n.dur;
            if (es !== n.es || ef !== n.ef) { n.es = es; n.ef = ef; changed = true; }
          });
        }

        const maxTot = Math.max(...Object.values(nodes).map(x => x.ef), 1);
        Object.values(nodes).forEach(n => { n.lf = maxTot; n.ls = n.lf - n.dur; });

        changed = true; g = 0;
        while (changed && g++ < 100) {
          changed = false;
          tareas.forEach(t => {
            const n = nodes[t.id];
            const succ = tareas.filter(s => (s.depende_de || []).includes(n.id));
            if (succ.length > 0) {
              const minLs = Math.min(...succ.map(s => nodes[s.id].ls));
              if (minLs !== n.lf) { n.lf = minLs; n.ls = n.lf - n.dur; changed = true; }
            }
          });
        }

        const criticos = new Set();
        Object.values(nodes).forEach(n => {
          if (Math.abs(n.ls - n.es) < 0.001) criticos.add(n.id);
        });
        return { criticos, nodes, totalSemanas: maxTot };
      },

      calcularMapADC(adc, aire, agua) {
        const a = Number(adc), sAire = Number(aire), sAgua = Number(agua);
        if (sAire === sAgua) return 0;
        const r = ((a - sAire) * 100) / (sAgua - sAire);
        return Math.max(0, Math.min(100, Math.round(r * 10) / 10));
      }
    };

        const i3 = Logic.formatMemberName("Integrante 3");

          `${DataStore.state.config.asignatura} • ${DataStore.state.config.docente} • ${i1} | ${i2} | ${i3}`;

        switch (this.currentTab) {
          case "panel": c.innerHTML = this.renderPanelPrincipal(); break;

          case "arbol":
          case "tablero":
          case "dependencias":
            c.innerHTML = this.renderVistaTareasHub();
            break;

          case "semana":
            c.innerHTML = this.renderVistaCronogramaHub();
            break;
          case "bitacora": c.innerHTML = this.renderVistaBitacora(); break;

          case "compras":
          case "listas":
          case "referencia":
          case "config":

      /* ========================================================================
         2. VISTA ÁRBOL — LÍNEAS DE CHECKOUT DE IZQUIERDA A DERECHA (HORIZONTAL)
         ======================================================================== */
      renderVistaArbol() {
        const st = DataStore.state;
        const tareas = st.tareas;
        const p1 = tareas.filter(t => t.parte === 1);
        const p2 = tareas.filter(t => t.parte === 2);
        const progTotal = Logic.getWeightedProgress(tareas);
        const progP1 = Logic.getWeightedProgress(p1);
        const progP2 = Logic.getWeightedProgress(p2);
        const u = st.config.usuario_actual || "Todos";

        const fasesP1 = [...new Set(p1.map(t => t.fase))];
        const fasesP2 = [...new Set(p2.map(t => t.fase))];

        const libresCount = tareas.filter(t => !t.rol_responsable || t.rol_responsable === "Sin asignar" || t.rol_responsable === "Libre").length;
        const angeloCount = tareas.filter(t => (t.rol_responsable || "").includes("Angelo") || (t.rol_responsable || "").includes("Integrante 2")).length;
        const xavierCount = tareas.filter(t => (t.rol_responsable || "").includes("Xavier") || (t.rol_responsable || "").includes("Integrante 1")).length;
        const fernandoCount = tareas.filter(t => (t.rol_responsable || "").includes("Fernando") || (t.rol_responsable || "").includes("Integrante 3")).length;
        const revisionCount = tareas.filter(t => t.estado === "En revisión").length;
        const hechasCount = tareas.filter(t => t.estado === "Hecha").length;

        return `
          <div class="checkout-tree-container">
            <!-- Barra de control y filtros del árbol -->
            <div style="display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap;">
              <div>
                <h2 style="font-size:18px; font-weight:800; display:flex; align-items:center; gap:8px;">
                  ${Icons.tree}
                  <span>Ruta en Árbol — Ramas de Checkout de Izquierda a Derecha</span>
                </h2>
                <p style="font-size:12.5px; color:var(--text-muted); margin-top:3px;">
                  Las tareas están sueltas en la bolsa. Cualquiera puede tomar una tarea libre, se pinta de su color pastel individual y al finalizar se tiñe de verde sin desaparecer.
                </p>
              </div>

              <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                <button class="btn btn-sm ${this.treeFilter === 'todos' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('todos')">Todo</button>
                <button class="btn btn-sm ${this.treeFilter === 'libres' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('libres')" style="font-weight:700;">Bolsa / Libres (${libresCount})</button>
                <button class="btn btn-sm ${this.treeFilter === 'mis' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('mis')">Solo Mis Tareas (${this.escapeHtml(u)})</button>
                <button class="btn btn-sm ${this.treeFilter === 'p1' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('p1')">Parte 1</button>
                <button class="btn btn-sm ${this.treeFilter === 'p2' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('p2')">Parte 2</button>
              </div>
            </div>

            <!-- BANNER DE BOLSA DE TAREAS Y ESTADOS PASTEL -->
            <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin-bottom:22px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <span style="font-size:12px; font-weight:800; text-transform:uppercase; color:var(--accent);">Bolsa de Tareas:</span>
                <span class="badge pastel-libre" style="font-size:11.5px; padding:4px 9px;">${libresCount} Disponibles</span>
                <span class="badge pastel-user-angelo" style="font-size:11.5px; padding:4px 9px;">Angelo: ${angeloCount}</span>
                <span class="badge pastel-user-xavier" style="font-size:11.5px; padding:4px 9px;">Xavier: ${xavierCount}</span>
                <span class="badge pastel-user-fernando" style="font-size:11.5px; padding:4px 9px;">Fernando: ${fernandoCount}</span>
                <span class="badge pastel-en-revision" style="font-size:11.5px; padding:4px 9px;">${revisionCount} En revisión</span>
                <span class="badge pastel-hecha" style="font-size:11.5px; padding:4px 9px;">${hechasCount} Finalizadas</span>
              </div>
              <div style="display:flex; gap:6px;">
                <button class="btn btn-sm" onclick="App.liberarTodasPendientes()" style="font-size:11px; opacity:0.85;" title="Soltar a la bolsa todas las tareas pendientes para tomarlas libremente">
                  Soltar pendientes a la bolsa
                </button>
              </div>
            </div>

            <!-- NODO RAÍZ PRINCIPAL -->
            <div style="display:flex; align-items:center; gap:16px; margin-bottom:26px;">
              <div class="checkout-root-node">
                <div style="width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;">
                  ${Icons.leaf}
                </div>
                <div>
                  <div style="font-size:14px; font-weight:800;">Cámara de Germinación Inteligente IoT</div>
                  <div style="font-size:11px; color:var(--text-muted);">Grupo 1 • EPN 2026-B</div>
                </div>
                <div style="margin-left:10px; background:var(--accent-soft); color:var(--accent); padding:3px 9px; border-radius:6px; font-size:12px; font-weight:700;">
                  ${progTotal}% Avance
                </div>
              </div>
              <div style="flex:1; height:2px; background:linear-gradient(90deg, var(--accent), var(--border));"></div>
            </div>

            <!-- RAMA SUPERIOR: PARTE 1 (PRIMER BIMESTRE) -->
            ${(this.treeFilter === 'todos' || this.treeFilter === 'mis' || this.treeFilter === 'libres' || this.treeFilter === 'p1') ? `
              <div class="checkout-branch parte-1">
                <div class="checkout-branch-header">
                  <div class="checkout-branch-title" style="color:var(--info);">
                    <span style="width:12px; height:12px; border-radius:50%; background:var(--info); display:inline-block;"></span>
                    <span>PARTE 1: Prototipo en Protoboard y Lote Piloto (1er Bimestre)</span>
                  </div>
                  <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:12px; font-weight:700; color:var(--info);">${progP1}% Completado</span>
                    <div class="progress-wrap" style="width:90px;"><div class="progress-bar" style="width:${progP1}%; background:var(--info);"></div></div>
                  </div>
                </div>

                <!-- Pista horizontal de fases de izquierda a derecha -->
                <div class="checkout-phases-track">
                  ${fasesP1.map((faseNombre, idx) => {
                    let tFase = p1.filter(t => t.fase === faseNombre);
                    if (this.treeFilter === 'mis' && u !== "Todos") {
                      tFase = tFase.filter(t => Logic.taskBelongsToUser(t, u));
                    } else if (this.treeFilter === 'libres') {
                      tFase = tFase.filter(t => Logic.taskBelongsToUser(t, 'Libres'));
                    }
                    if (tFase.length === 0) return '';
                    const progFase = Logic.getWeightedProgress(tFase);
                    return `
                      <div class="checkout-phase-col">
                        <div class="checkout-phase-header">
                          <span title="${this.escapeHtml(faseNombre)}">Fase ${idx + 1}: ${this.escapeHtml(faseNombre)}</span>
                          <span style="font-size:11px; color:var(--text-muted); font-weight:700;">${progFase}%</span>
                        </div>
                        <div class="checkout-tasks-flow">
                          ${tFase.map(t => this.renderPastelTaskCard(t)).join("")}
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            ` : ''}

            <!-- RAMA INFERIOR: PARTE 2 (SEGUNDO BIMESTRE) -->
            ${(this.treeFilter === 'todos' || this.treeFilter === 'mis' || this.treeFilter === 'libres' || this.treeFilter === 'p2') ? `
              <div class="checkout-branch parte-2">
                <div class="checkout-branch-header">
                  <div class="checkout-branch-title" style="color:var(--purple);">
                    <span style="width:12px; height:12px; border-radius:50%; background:var(--purple); display:inline-block;"></span>
                    <span>PARTE 2: Prototipo Final en PCB, Acrílico y Visión (2do Bimestre)</span>
                  </div>
                  <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:12px; font-weight:700; color:var(--purple);">${progP2}% Completado</span>
                    <div class="progress-wrap" style="width:90px;"><div class="progress-bar" style="width:${progP2}%; background:var(--purple);"></div></div>
                  </div>
                </div>

                <!-- Pista horizontal de fases de izquierda a derecha -->
                <div class="checkout-phases-track">
                  ${fasesP2.map((faseNombre, idx) => {
                    let tFase = p2.filter(t => t.fase === faseNombre);
                    if (this.treeFilter === 'mis' && u !== "Todos") {
                      tFase = tFase.filter(t => Logic.taskBelongsToUser(t, u));
                    } else if (this.treeFilter === 'libres') {
                      tFase = tFase.filter(t => Logic.taskBelongsToUser(t, 'Libres'));
                    }
                    if (tFase.length === 0) return '';
                    const progFase = Logic.getWeightedProgress(tFase);
                    return `
                      <div class="checkout-phase-col">
                        <div class="checkout-phase-header">
                          <span title="${this.escapeHtml(faseNombre)}">Fase ${idx + 1}: ${this.escapeHtml(faseNombre)}</span>
                          <span style="font-size:11px; color:var(--text-muted); font-weight:700;">${progFase}%</span>
                        </div>
                        <div class="checkout-tasks-flow">
                          ${tFase.map(t => this.renderPastelTaskCard(t)).join("")}
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      },

                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="task-id" style="font-size:14px;">${q.id}</span>
                    <select onchange="App.actualizarEstadoPregunta('${q.id}', this.value)" style="width:auto; font-size:12px; padding:3px 8px;">
                      <option value="pendiente" ${q.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                      <option value="respondida" ${q.estado === 'respondida' ? 'selected' : ''}>Respondida</option>
                    </select>
                  </div>
                  <div style="font-weight:700; margin:8px 0; font-size:14px;">${this.escapeHtml(q.pregunta)}</div>
                  <div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">${this.escapeHtml(q.notas || '')}</div>

                    <textarea rows="2" placeholder="Escribir respuesta obtenida de la docente..." onchange="App.actualizarRespuestaPregunta('${q.id}', this.value)" style="margin-top:4px;">${this.escapeHtml(q.respuesta || '')}</textarea>

              `).join("")}

      /* Vista Grid de Tarjetas de Tareas */
      renderVistaGridTareas() {
        const st = DataStore.state;
        const tareas = st.tareas;
        const u = st.config.usuario_actual || "Todos";

        let filtradas = tareas;
        if (this.treeFilter === 'libres') {
          filtradas = filtradas.filter(t => !t.rol_responsable || t.rol_responsable === "Sin asignar" || t.rol_responsable === "Libre");
        } else if (this.treeFilter === 'mis' && u !== "Todos") {
          filtradas = filtradas.filter(t => Logic.taskBelongsToUser(t, u));
        } else if (this.treeFilter === 'p1') {
          filtradas = filtradas.filter(t => t.parte === 1);
        } else if (this.treeFilter === 'p2') {
          filtradas = filtradas.filter(t => t.parte === 2);
        } else if (this.treeFilter === 'hechas') {
          filtradas = filtradas.filter(t => t.estado === "Hecha");
        } else if (this.treeFilter === 'angelo') {
          filtradas = filtradas.filter(t => (t.rol_responsable || "").includes("Angelo") || (t.rol_responsable || "").includes("Integrante 2"));
        } else if (this.treeFilter === 'xavier') {
          filtradas = filtradas.filter(t => (t.rol_responsable || "").includes("Xavier") || (t.rol_responsable || "").includes("Integrante 1"));
        } else if (this.treeFilter === 'fernando') {
          filtradas = filtradas.filter(t => (t.rol_responsable || "").includes("Fernando") || (t.rol_responsable || "").includes("Integrante 3"));
        }

        if (this.taskSearchQuery) {
          const q = this.taskSearchQuery;
          filtradas = filtradas.filter(t => 
            t.id.toLowerCase().includes(q) || 
            t.titulo.toLowerCase().includes(q) || 
            (t.descripcion || "").toLowerCase().includes(q) ||
            t.fase.toLowerCase().includes(q)
          );
        }

        return `
          <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:18px; box-shadow:var(--shadow);">
            <!-- Barra de búsqueda y filtros rápidos -->
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
              <div style="flex:1; min-width:240px; position:relative;">
                <input type="text" placeholder="Buscar tarea por ID, título, fase o componente..." value="${this.escapeHtml(this.taskSearchQuery)}" oninput="App.setTaskSearch(this.value)" style="padding-left:12px; font-size:13px; border-radius:8px;" />
              </div>
              <div style="font-size:12px; color:var(--text-muted); font-weight:600;">
                Mostrando ${filtradas.length} de ${tareas.length} tareas
              </div>
            </div>

            <!-- Filtros pills -->
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;">
              <button class="btn btn-sm ${this.treeFilter === 'todos' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('todos')">Todo (${tareas.length})</button>
              <button class="btn btn-sm ${this.treeFilter === 'libres' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('libres')" style="font-weight:800; border:1.5px dashed var(--accent);">🌟 Bolsa / Libres (${tareas.filter(t => !t.rol_responsable || t.rol_responsable === 'Sin asignar' || t.rol_responsable === 'Libre').length})</button>
              <button class="btn btn-sm ${this.treeFilter === 'mis' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('mis')">Mis Tareas (${this.escapeHtml(u)})</button>
              <button class="btn btn-sm ${this.treeFilter === 'p1' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('p1')">Parte 1 (23 Nov)</button>
              <button class="btn btn-sm ${this.treeFilter === 'p2' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('p2')">Parte 2 (25 Ene)</button>
              <button class="btn btn-sm ${this.treeFilter === 'hechas' ? 'btn-primary' : ''}" onclick="App.setTreeFilter('hechas')" style="color:var(--accent);">✔ Finalizadas (${tareas.filter(t => t.estado === 'Hecha').length})</button>
            </div>

            ${filtradas.length === 0 ? `
              <div style="text-align:center; padding:40px; color:var(--text-muted); background:var(--bg-card); border-radius:10px; border:1px dashed var(--border);">
                <p style="font-size:14px; font-weight:700;">No se encontraron tareas con los filtros seleccionados.</p>
                <button class="btn btn-sm btn-primary" onclick="App.setTreeFilter('todos'); App.setTaskSearch('');" style="margin-top:8px;">Ver todas las tareas</button>
              </div>
            ` : `
              <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:14px;">
                ${filtradas.map(t => this.renderPastelTaskCard(t)).join("")}
              </div>
            `}
          </div>
        `;
      },

                  <div style="font-size:13px; font-weight:800; color:var(--text-main);">${this.escapeHtml(miNombre)}</div>
                </div>
              </div>
            </div>

            <!-- HITOS OFICIALES DE ENTREGA (23 NOV Y 25 ENE) -->
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:12px; margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">

              <div style="background:var(--bg-card); border:1.5px solid var(--info); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:6px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span style="font-size:11px; font-weight:800; text-transform:uppercase; color:var(--info); display:inline-flex; align-items:center; gap:5px;">
                    🏁 Hito Entrega Parte 1

                  <span class="badge" style="background:var(--info-soft); color:var(--info); font-weight:800;">

                  </span>

                <div style="display:flex; justify-content:space-between; align-items:baseline;">
                  <div style="font-size:17px; font-weight:800;">23 de Noviembre de 2026</div>

                </div>
                <div class="progress-wrap" style="height:6px;"><div class="progress-bar" style="width:${progP1}%; background:var(--info);"></div></div>
                <div style="font-size:11.5px; color:var(--text-muted); line-height:1.3;">
                  Prototipo en protoboard, lote piloto de 4-5 días, telemetría MQTT y primer informe técnico.
                </div>
              </div>

              <!-- Hito Parte 2 -->
              <div style="background:var(--bg-card); border:1.5px solid var(--purple); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:6px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span style="font-size:11px; font-weight:800; text-transform:uppercase; color:var(--purple); display:inline-flex; align-items:center; gap:5px;">
                    🏆 Hito Defensa Final Parte 2
                  </span>
                  <span class="badge" style="background:var(--purple-soft); color:var(--purple); font-weight:800;">
                    Quedan ${diasP2} días
                  </span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:baseline;">
                  <div style="font-size:17px; font-weight:800;">25 de Enero de 2027</div>
                  <div style="font-size:12.5px; font-weight:700; color:var(--purple);">${progP2}%</div>
                </div>
                <div class="progress-wrap" style="height:6px;"><div class="progress-bar" style="width:${progP2}%; background:var(--purple);"></div></div>
                <div style="font-size:11.5px; color:var(--text-muted); line-height:1.3;">
                  PCB definitiva, estructura acrílica, visión OpenCV (ESP32-CAM) y dos lotes reales autónomos.
                </div>
              </div>
            </div>
          </div>

          <!-- 4 TARJETAS KPI DE EQUIPO (PASTEL Y SUAVES) -->
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:18px;">
            <!-- Total -->
            <div class="card" style="padding:14px; border-radius:12px; display:flex; flex-direction:column; gap:4px;">
              <div style="font-size:11.5px; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Total Tareas</div>
              <div style="display:flex; justify-content:space-between; align-items:baseline;">
                <span style="font-size:26px; font-weight:800; color:var(--text-main);">${tareas.length}</span>
                <span style="font-size:13px; font-weight:700; color:var(--accent);">${progTotal}% total</span>
              </div>
              <div class="progress-wrap" style="height:5px;"><div class="progress-bar" style="width:${progTotal}%;"></div></div>
            </div>

            <!-- Bolsa Libres -->
            <div class="card" style="padding:14px; border-radius:12px; border:1.5px dashed var(--accent); background:rgba(16, 185, 129, 0.05); cursor:pointer;" onclick="App.setTreeFilter('libres'); App.setTasksSubView('grid');" title="Clic para ver tareas libres para tomar">
              <div style="font-size:11.5px; color:var(--accent); font-weight:800; text-transform:uppercase;">🌟 Libres en Bolsa</div>
              <div style="display:flex; justify-content:space-between; align-items:baseline;">
                <span style="font-size:26px; font-weight:800; color:var(--accent);">${libresCount}</span>
                <span style="font-size:11px; font-weight:700; color:var(--accent);">Tomar en 1-clic</span>
              </div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">Disponibles para cualquiera</div>

                <span style="font-size:26px; font-weight:800; color:var(--info);">${totalEnCurso}</span>
                <span style="font-size:11.5px; color:var(--text-muted);">${totalRevision} en revisión</span>
              </div>
              <div style="font-size:11px; color:var(--text-muted);">Siendo desarrolladas ahora</div>
            </div>

            <!-- Finalizadas -->
            <div class="card pastel-hecha" style="padding:14px; border-radius:12px; display:flex; flex-direction:column; gap:4px; border:1.5px solid #10b981;">
              <div style="font-size:11.5px; font-weight:800; text-transform:uppercase; color:#065f46;">✔ Finalizadas</div>
              <div style="display:flex; justify-content:space-between; align-items:baseline;">
                <span style="font-size:26px; font-weight:800; color:#065f46;">${totalHechas}</span>
                <span style="font-size:11.5px; font-weight:700; color:#065f46;">Verde menta</span>
              </div>
              <div style="font-size:11px; color:#065f46; opacity:0.85;">Permanecen siempre visibles</div>
            </div>
          </div>

          <!-- FILA DE ESTADO DE LOS 3 INTEGRANTES -->
          <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:12px 16px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
            <div style="font-size:12px; font-weight:800; text-transform:uppercase; color:var(--text-muted);">
              Carga del Equipo (3 Integrantes):
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn btn-sm pastel-user-angelo" onclick="App.setTreeFilter('angelo'); App.setTasksSubView('grid');" style="font-size:12px; font-weight:700;">
                Angelo Conterón (${angeloCount})
              </button>
              <button class="btn btn-sm pastel-user-xavier" onclick="App.setTreeFilter('xavier'); App.setTasksSubView('grid');" style="font-size:12px; font-weight:700;">
                Xavier Anatoa (${xavierCount})
              </button>
              <button class="btn btn-sm pastel-user-fernando" onclick="App.setTreeFilter('fernando'); App.setTasksSubView('grid');" style="font-size:12px; font-weight:700;">
                Fernando Guarderas (${fernandoCount})
              </button>
            </div>
          </div>

          <!-- EXPLORADOR PRINCIPAL DE TAREAS ("EN LA PANTALLA PRINCIPAL SE VEAN MEJOR LAS TAREAS") -->
          <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow);">
            <!-- Barra de control de vista en el dashboard -->
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
              <div>
                <h2 style="font-size:18px; font-weight:800; display:flex; align-items:center; gap:8px; margin:0;">
                  ${Icons.tree}
                  <span>Tareas del Proyecto IoT</span>
                </h2>
                <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
                  Visualiza el flujo de trabajo en Árbol de Ramas, Tarjetas o Tablero Kanban.
                </div>
              </div>

              <!-- Switcher de modo en el dashboard -->
              <div style="display:flex; background:var(--bg-card); padding:3px; border-radius:8px; border:1px solid var(--border); gap:3px;">
                <button class="btn btn-sm ${subView === 'arbol' ? 'btn-primary' : ''}" onclick="App.setTasksSubView('arbol')" style="gap:5px;">
                  ${Icons.tree} <span>Árbol de Ramas</span>
                </button>
                <button class="btn btn-sm ${subView === 'grid' ? 'btn-primary' : ''}" onclick="App.setTasksSubView('grid')" style="gap:5px;">
                  ${Icons.list} <span>Tarjetas Grid</span>
                </button>
                <button class="btn btn-sm ${subView === 'tablero' ? 'btn-primary' : ''}" onclick="App.setTasksSubView('tablero')" style="gap:5px;">

      cambiarSemanaActiva(delta) {
        let s = Number(DataStore.state.config.semana_actual_p1 || 1) + delta;
        if (s < 1) s = 1;
        if (s > 9) s = 9;
        DataStore.state.config.semana_actual_p1 = s;
        DataStore.save();
        this.render();
      },

      toggleVerificacion(id) {
        const v = DataStore.state.verificaciones_pendientes.find(x => x.id === id);
        if (v) {
          v.cerrado = !v.cerrado;
          DataStore.save();
          this.render();
        }
      },

      /* ========================================================================
         3. VISTA TABLERO (KANBAN CON TARJETAS PASTEL)
         ======================================================================== */
      renderVistaTablero() {
        const st = DataStore.state;
        const f = this.kanbanFilters;
        let lista = st.tareas.filter(t => {
          if (f.parte !== "todas" && t.parte !== Number(f.parte)) return false;
          if (f.responsable !== "todos" && !Logic.taskBelongsToUser(t, f.responsable)) return false;
          if (f.etiqueta !== "todas" && !(t.etiquetas || []).includes(f.etiqueta)) return false;
          if (f.busqueda) {
            const q = f.busqueda.toLowerCase();
            const txt = (t.id + " " + t.titulo + " " + t.descripcion).toLowerCase();
            if (!txt.includes(q)) return false;
          }
          return true;
        });

        const estados = ["Pendiente", "En curso", "En revisión", "Hecha"];

        return `
          <div class="card" style="margin-bottom:14px;">
            <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
              <div style="flex:1; min-width:200px;">
                <input type="text" placeholder="Buscar por ID, título o descripción..." value="${this.escapeHtml(f.busqueda)}" oninput="App.filtrarKanban('busqueda', this.value)" />
              </div>
              <div style="width:160px;">
                <select onchange="App.filtrarKanban('parte', this.value)">
                  <option value="todas" ${f.parte === 'todas' ? 'selected' : ''}>Todas las Partes</option>
                  <option value="1" ${f.parte === '1' ? 'selected' : ''}>Parte 1 (T1)</option>
                  <option value="2" ${f.parte === '2' ? 'selected' : ''}>Parte 2 (T2)</option>
                </select>
              </div>
              <div style="width:190px;">
                <select onchange="App.filtrarKanban('responsable', this.value)">
                  <option value="todos" ${f.responsable === 'todos' ? 'selected' : ''}>Todos los responsables</option>
                  <option value="libres" ${f.responsable === 'libres' ? 'selected' : ''}>Libres / Sin asignar (Bolsa)</option>
                  <option value="Angelo Conterón" ${f.responsable === 'Angelo Conterón' ? 'selected' : ''}>Angelo Conterón</option>
                  <option value="Xavier Anatoa" ${f.responsable === 'Xavier Anatoa' ? 'selected' : ''}>Xavier Anatoa</option>
                  <option value="Fernando Guarderas" ${f.responsable === 'Fernando Guarderas' ? 'selected' : ''}>Fernando Guarderas</option>
                </select>
              </div>
              <div style="width:160px;">
                <select onchange="App.filtrarKanban('etiqueta', this.value)">
                  <option value="todas">Todas las etiquetas</option>
                  <option value="[PDF]" ${f.etiqueta === '[PDF]' ? 'selected' : ''}>[PDF]</option>
                  <option value="[DISEÑO]" ${f.etiqueta === '[DISEÑO]' ? 'selected' : ''}>[DISEÑO]</option>
                  <option value="[A VERIFICAR]" ${f.etiqueta === '[A VERIFICAR]' ? 'selected' : ''}>[A VERIFICAR]</option>
                  <option value="[OPCIONAL]" ${f.etiqueta === '[OPCIONAL]' ? 'selected' : ''}>[OPCIONAL]</option>
                </select>
              </div>
            </div>
          </div>

          <div class="kanban-board">
            ${estados.map(est => {
              const items = lista.filter(t => t.estado === est);
              return `
                <div class="kanban-col">
                  <div class="kanban-col-header">
                    <span>${est}</span>
                    <span class="badge status-${est.replace(/\s+/g, '-').replace('ó', 'o')}">${items.length}</span>
                  </div>
                  <div class="kanban-dropzone" ondragover="event.preventDefault(); this.classList.add('drag-over');" ondragleave="this.classList.remove('drag-over');" ondrop="App.handleKanbanDrop(event, '${est}')">
                    ${items.map(t => `

                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

      openTaskModal(taskId) {

        const panel = document.getElementById("task-modal-content");
        if (m && panel) {
          panel.innerHTML = this.renderTaskModalContent(taskId);
          m.classList.add("open");
        }
      },

        if (m) m.classList.remove("open");
        this.render();
      },

      cambiarSubtabModal(sub) {
        this.activeModalSubtab = sub;

        if (panel && this.activeModalTaskId) {
          panel.innerHTML = this.renderTaskModalContent(this.activeModalTaskId);

      toggleCriterioModal(tId, checked) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          t.criterio_aprobado = checked;
          t.historial.unshift({ fecha: new Date().toISOString(), autor: DataStore.state.config.usuario_actual || "Equipo", cambio: `Criterio de aceptación ${checked ? 'APROBADO' : 'desmarcado'}` });
          DataStore.save();
          this.cambiarSubtabModal(this.activeModalSubtab);
        }
      },

      cambiarEstadoModal(tId, nuevoEstado) {
        Logic.changeTaskStatus(tId, nuevoEstado);
        this.cambiarSubtabModal(this.activeModalSubtab);
      },

      togglePasoModal(tId, pId, checked) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          const p = t.pasos.find(x => x.id === pId);
          if (p) {
            p.hecho = checked;
            if (p.subpasos && p.subpasos.length > 0) {
              p.subpasos.forEach(s => {
                s.hecho = checked;
                if (s.ref_id) {
                  const q = DataStore.state.preguntas.find(x => x.id === s.ref_id);
                  if (q && checked && !q.respuesta) {
                    q.estado = 'respondida';
                    q.fecha = new Date().toISOString().slice(0, 10);
                  }
                }
              });
            }
          }
          DataStore.save();
          this.cambiarSubtabModal(this.activeModalSubtab);
        }
      },

      toggleSubpasoModal(tId, pId, subIndex, checked) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          const p = t.pasos.find(x => x.id === pId);
          if (p && p.subpasos && p.subpasos[subIndex]) {
            p.subpasos[subIndex].hecho = checked;
            const refId = p.subpasos[subIndex].ref_id;
            if (refId) {
              const q = DataStore.state.preguntas.find(x => x.id === refId);
              if (q) {
                if (checked && !q.respuesta) {
                  q.estado = 'respondida';
                  q.fecha = new Date().toISOString().slice(0, 10);
                } else if (!checked && !p.subpasos[subIndex].respuesta) {
                  q.estado = 'pendiente';
                }
              }
            }
            // Auto marcar o desmarcar paso principal según sus subtareas
            const todosHechos = p.subpasos.every(s => s.hecho);
            if (todosHechos) {
              p.hecho = true;
            } else if (p.hecho && !checked) {
              p.hecho = false;
            }
            DataStore.save();
            this.cambiarSubtabModal(this.activeModalSubtab);
          }
        }
      },

      actualizarRespuestaSubpaso(tId, pId, subIndex, refId, respuesta) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          const p = t.pasos.find(x => x.id === pId);
          if (p && p.subpasos && p.subpasos[subIndex]) {
            p.subpasos[subIndex].respuesta = respuesta;
            if (respuesta.trim() !== '') {
              p.subpasos[subIndex].hecho = true;
            }
            const todosHechos = p.subpasos.every(s => s.hecho);
            if (todosHechos) p.hecho = true;
          }
        }
        if (refId) {
          const q = DataStore.state.preguntas.find(x => x.id === refId);
          if (q) {
            q.respuesta = respuesta;
            if (respuesta.trim() !== '') {
              q.estado = 'respondida';
              q.fecha = new Date().toISOString().slice(0, 10);
            }
          }
        }
        DataStore.save();
        this.cambiarSubtabModal(this.activeModalSubtab);
      },

      agregarPasoModal(tId) {
        const texto = prompt("Nuevo paso a ejecutar:");
        if (!texto) return;
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          t.pasos.push({ id: `${t.id}-P${t.pasos.length + 1}`, texto, hecho: false });
          DataStore.save();
          this.cambiarSubtabModal(this.activeModalSubtab);
        }
      },

      eliminarPasoModal(tId, pId) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          t.pasos = t.pasos.filter(x => x.id !== pId);
          DataStore.save();
          this.cambiarSubtabModal(this.activeModalSubtab);
        }
      },

      actualizarCampoTarea(tId, campo, valor) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          t[campo] = valor;
          t.actualizada = new Date().toISOString();
          DataStore.save();
        }
      },

      actualizarSemanaTarea(tId, campo, valor) {
        const t = DataStore.state.tareas.find(x => x.id === tId);
        if (t) {
          t[campo] = Number(valor);
          Logic.recalcularFechas();
          this.cambiarSubtabModal(this.activeModalSubtab);
        }
      },

        const pCap2 = Logic.calcularMapADC(cal.cap2_adc_prueba, cal.cap2_aire, cal.cap2_agua);

              </div>

                  <div><label style="font-size:11px;">Agua Línea (100%):</label><input type="number" value="${cal.cap1_agua}" onchange="App.actualizarCalib('cap1_agua', this.value)" /></div>
                  <div><label style="font-size:11px;">ADC Prueba:</label><input type="number" value="${cal.cap1_adc_prueba}" oninput="App.actualizarCalib('cap1_adc_prueba', this.value)" /></div>
                </div>
                <div style="margin-top:8px; font-weight:700; color:var(--accent);">
                  Porcentaje Calculado: ${pCap1}%

              </div>

              <div style="background:var(--bg-card); padding:10px; border-radius:8px;">
                <strong>Sensor #2 (Respaldo)</strong>

                  <div><label style="font-size:11px;">Aire Seco (0%):</label><input type="number" value="${cal.cap2_aire}" onchange="App.actualizarCalib('cap2_aire', this.value)" /></div>

                <div style="margin-top:8px; font-weight:700; color:var(--accent);">

                <strong>Sensor de Nivel de Agua</strong>

                  <div><label style="font-size:11px;">Con semillas germinando (Rs):</label><input type="number" value="${cal.mq135_rs_adc}" onchange="App.actualizarCalib('mq135_rs_adc', this.value)" /></div>

      renderPlantillaPiloto() {
        const st = DataStore.state;
        const cfg = st.config.piloto_config;
        const visitas = st.piloto_visitas || [];

        // Generar puntos SVG para curva de % germinación
        const w = 600, h = 180, pad = 30;
        let points = "";
        if (visitas.length > 1) {
          points = visitas.map((v, i) => {
            const x = pad + (i / (visitas.length - 1)) * (w - 2 * pad);
            const y = h - pad - (v.porcentaje_germ / 100) * (h - 2 * pad);
            return `${x},${y}`;
          }).join(" ");
        }

        return `
          <div class="card" style="margin-bottom:14px;">
            <div class="card-header">
              <div class="card-title">Curva de % Germinación en Tiempo Real</div>
              <button class="btn btn-sm btn-primary" onclick="App.agregarVisitaPilotoPrompt()">+ Registrar Visita</button>
            </div>
            <div style="width:100%; overflow-x:auto;">
              <svg viewBox="0 0 ${w} ${h}" style="width:100%; max-height:220px; background:var(--bg-input); border-radius:8px;">
                <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="var(--border)" stroke-width="2" />
                <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h - pad}" stroke="var(--border)" stroke-width="2" />
                <!-- Línea umbral 80% -->
                <line x1="${pad}" y1="${h - pad - 0.8 * (h - 2 * pad)}" x2="${w - pad}" y2="${h - pad - 0.8 * (h - 2 * pad)}" stroke="var(--accent)" stroke-dasharray="4" />
                <text x="${w - pad - 60}" y="${h - pad - 0.8 * (h - 2 * pad) - 4}" fill="var(--accent)" font-size="10">Meta 80%</text>
                ${points ? `<polyline points="${points}" fill="none" stroke="var(--info)" stroke-width="3" />` : ''}
                ${visitas.map((v, i) => {
                  const x = pad + (i / Math.max(1, visitas.length - 1)) * (w - 2 * pad);

      agregarVisitaPilotoPrompt() {
        const N = DataStore.state.config.piloto_config.n_semillas || 25;
        const nStr = prompt(`Semillas con radícula emergida (>= 2 mm) sobre N = ${N}:`, "0");
        if (nStr === null) return;
        const n = Math.min(N, Math.max(0, Number(nStr) || 0));
        const pct = Math.round((n / N) * 100);
        const temp = Number(prompt("Temperatura actual (°C):", "20.5") || 20);
        const humA = Number(prompt("Humedad relativa del aire (%):", "85") || 85);
        const humS = Number(prompt("Humedad de sustrato (%):", "76") || 76);
        const obs = prompt("Observaciones (condensación, hongos, etc.):", "Normal");

        const id = `VIS-${String(DataStore.state.piloto_visitas.length + 1).padStart(2, '0')}`;
        DataStore.state.piloto_visitas.push({
          id,
          dia: DataStore.state.piloto_visitas.length + 1,
          hora_bloque: "12:00",
          fecha_hora: new Date().toISOString().slice(0, 16),
          temp_c: temp,
          hum_aire: humA,
          hum_sustrato: humS,
          gddh_acum: Math.round(temp * 12),
          radiculas_n: n,
          porcentaje_germ: pct,
          agua_estado: "Sí",
          archivo_foto: `piloto_${id}.jpg`,
          observaciones: obs || ""
        });
        DataStore.save();
        this.render();
      },
